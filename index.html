<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mom's Board</title>
<style>
  /* ============================================================
     Mom's Cognitive Support Display — V2 layout (static mock data)
     Designed at exactly 1280 x 720. The .stage is scaled to fit
     whatever viewport Silk gives us, so the layout is PIXEL-
     IDENTICAL on the 24" table TV and (later) the other two TVs.
     No scrolling, no interaction required.

     On a non-16:9 window (i.e. any laptop) you WILL see black bars
     at the sides. That is the letterbox, not the layout. On the
     720p TV the ratio matches exactly and it fills the screen.
     ============================================================ */

  :root{
    --paper:#f6f2e9; --ink:#23201b; --muted:#7a7264; --soft:#5f584c;
    --line:#e2dccd; --card:#fffdf8;
    --done:#4f9c63;    --done-ink:#3f6b4b;   /* already happened      */
    --mark:#c08a20;                          /* "today" divider       */
    --note-ink:#2b4a66;                      /* times / upcoming      */

    /* Kept for the medication card if it ever comes back — see notes. */
    --ok-bg:#e3f1e4; --ok-ink:#245c33; --ok-edge:#4f9c63;
    --soon-bg:#fbeecf; --soon-ink:#6b4a12; --soon-edge:#d69a2c;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%; background:#000; overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #frame{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }

  .stage{
    width:1280px; height:720px; transform-origin:center center;
    background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; padding:24px 32px 20px; gap:18px;
    overflow:hidden;
  }

  /* ---- Header: the single most-asked question, full width ---- */
  .head{ display:flex; align-items:baseline; justify-content:space-between; gap:28px; }
  .today-is{
    font-size:54px; font-weight:800; letter-spacing:-0.5px; line-height:1.05;
    white-space:nowrap; overflow:hidden; flex:1 1 auto; min-width:0;
  }
  .clock{
    flex:0 0 auto; font-size:46px; font-weight:800; line-height:1;
    font-variant-numeric:tabular-nums; color:var(--soft); white-space:nowrap;
  }

  /* ---- Body: left = today + notes, right = full-height timeline ---- */
  .grid{ flex:1; display:grid; grid-template-columns:46fr 54fr; gap:18px; min-height:0; overflow:hidden; }
  .col{ display:flex; flex-direction:column; gap:18px; min-height:0; overflow:hidden; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:18px 26px; display:flex; flex-direction:column; overflow:hidden;
  }
  .card.grow{ flex:1; min-height:0; }
  .cap{ font-size:22px; font-weight:800; letter-spacing:2.5px; color:var(--muted); margin-bottom:14px; }

  .today-list{ list-style:none; display:flex; flex-direction:column; gap:12px; }
  .today-list li{ font-size:33px; font-weight:700; line-height:1.15; display:flex; gap:14px; align-items:baseline; }
  .today-list .t{ color:var(--note-ink); white-space:nowrap; font-variant-numeric:tabular-nums; }

  .notes{ list-style:none; display:flex; flex-direction:column; gap:12px; }
  .notes li{ font-size:28px; font-weight:600; line-height:1.25; }

  /* ---- Timeline: past (✓) → TODAY → upcoming ---- */
  .cal{ list-style:none; display:flex; flex-direction:column; gap:13px; }
  .cal li{ display:flex; gap:14px; align-items:baseline; line-height:1.15; }
  .cal .mark{ flex:0 0 30px; font-size:26px; text-align:center; color:var(--done); }
  .cal .when{ flex:0 0 172px; font-size:26px; font-weight:700; color:var(--muted); white-space:nowrap; }
  .cal .what{ flex:1 1 auto; font-size:29px; font-weight:600; }
  .cal li.past .what{ color:var(--done-ink); }
  .cal li.ahead .when{ color:var(--note-ink); }

  .cal li.divider{ align-items:center; gap:14px; margin:3px 0 1px; }
  .cal li.divider .lbl{ font-size:19px; font-weight:800; letter-spacing:3px; color:var(--mark); }
  .cal li.divider .rule{ flex:1 1 auto; height:2px; background:var(--line); }

  .empty{ font-size:26px; font-weight:600; color:var(--muted); }

  /* ---- Footer: the reassurance line ---- */
  .reassure{ text-align:center; font-size:46px; font-weight:700; color:var(--soft); line-height:1.1; }
</style>
</head>
<body>
  <div id="frame">
    <div class="stage">

      <div class="head">
        <div class="today-is" id="today-is">—</div>
        <div class="clock" id="clock">—</div>
      </div>

      <div class="grid">
        <div class="col">
          <div class="card">
            <div class="cap">TODAY</div>
            <ul class="today-list" id="today-list"></ul>
          </div>
          <div class="card grow">
            <div class="cap">NOTES</div>
            <ul class="notes" id="notes"></ul>
          </div>
        </div>
        <div class="col">
          <div class="card grow">
            <div class="cap">CALENDAR</div>
            <ul class="cal" id="cal"></ul>
          </div>
        </div>
      </div>

      <div class="reassure" id="reassure">Everything is okay. You are safe and loved.</div>

    </div>
  </div>

<script>
/* ================================================================
   1. MOCK DATA — stand-in for the Google Sheet.

   When this is wired up the Sheet gets TWO tabs:
     "Days"   one row per date  -> today[] and notes[]
     "Events" one row per event -> calendar[]  (Date | Description)

   Note that calendar entries carry ONLY a date and a description.
   Whether something has already happened is computed from today's
   LA date, so nobody has to go back and tick things off.
   ================================================================ */
const DATA = {
  today: [
    { time:'2:00 PM', what:'Kat visits' },
    { time:'',        what:'A quiet afternoon at home' },
  ],
  notes: [
    'Your glasses are on the kitchen table.',
    'The blue folder has your bank papers in it.',
  ],
  calendar: [
    { date:'2026-08-03', what:'Susan called' },
    { date:'2026-08-05', what:'Greg called in the evening' },
    { date:'2026-08-06', what:'Kat called' },
    { date:'2026-08-09', what:'Susan calls at 2:00 PM' },
    { date:'2026-08-11', what:'Greg visits' },
    { date:'2026-08-14', what:'Doctor appointment at 10:30' },
  ],
  reassure: 'Everything is okay. You are safe and loved.',
};

/* 2. TIME — always America/Los_Angeles (Mom's timezone) */
const TZ='America/Los_Angeles';
const fmtTime =new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
const fmtToday=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric'});
const fmtISO  =new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
/* Calendar cells are plain dates with no time — format them in UTC so a
   machine in another timezone can never shift them by a day. */
const fmtRow  =new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});

function isoLA(d){                       // -> "2026-08-07"
  const p={}; fmtISO.formatToParts(d).forEach(x=>{ p[x.type]=x.value; });
  return p.year+'-'+p.month+'-'+p.day;
}
function isoToUTCDate(s){                // "2026-08-07" -> Date at UTC midnight
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||'').trim());
  return m ? new Date(Date.UTC(+m[1],+m[2]-1,+m[3])) : null;
}
function shiftISO(iso,days){
  const d=isoToUTCDate(iso); if(!d) return null;
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}

/* 3. RENDER */

/* Pick a window around today so the column never overflows: recent past
   above the divider, upcoming below, backfilling whichever side is short. */
const PAST_MAX=4, AHEAD_MAX=6, TOTAL_MAX=10;
function calendarWindow(items, todayISO){
  const clean=(items||[])
    .filter(e=>e&&isoToUTCDate(e.date)&&String(e.what||'').trim())
    .slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const past =clean.filter(e=>e.date<todayISO);
  const ahead=clean.filter(e=>e.date>=todayISO);
  let nPast =Math.min(past.length, PAST_MAX);
  let nAhead=Math.min(ahead.length,AHEAD_MAX);
  /* if one side is thin, let the other use the leftover rows */
  nAhead=Math.min(ahead.length,nAhead+(PAST_MAX-nPast));
  nPast =Math.min(past.length, nPast +(TOTAL_MAX-nPast-nAhead));
  return { past:past.slice(past.length-nPast), ahead:ahead.slice(0,nAhead) };
}

function whenLabel(iso, todayISO){
  if(iso===todayISO)                return 'Today';
  if(iso===shiftISO(todayISO,1))    return 'Tomorrow';
  const d=isoToUTCDate(iso);
  return d ? fmtRow.format(d) : '';
}

function calRow(e, todayISO, done){
  const li=document.createElement('li');
  li.className=done?'past':'ahead';
  const mark=document.createElement('span'); mark.className='mark'; mark.textContent=done?'✓':'';
  const when=document.createElement('span'); when.className='when'; when.textContent=whenLabel(e.date,todayISO);
  const what=document.createElement('span'); what.className='what'; what.textContent=e.what;
  li.appendChild(mark); li.appendChild(when); li.appendChild(what);
  return li;
}

function emptyRow(text){
  const li=document.createElement('li'); li.className='empty'; li.textContent=text; return li;
}

function render(data){
  const todayISO=isoLA(new Date());

  /* TODAY — deliberately NOT auto-greyed once a time passes. We don't know
     that something actually happened, and guessing is how you get a wrong
     answer to "did that happen yet?". */
  const tl=document.getElementById('today-list'); tl.innerHTML='';
  const items=(data.today||[]).filter(i=>i&&String(i.what||'').trim());
  if(!items.length){ tl.appendChild(emptyRow('Nothing planned today.')); }
  items.forEach(it=>{
    const li=document.createElement('li');
    if(String(it.time||'').trim()){
      const t=document.createElement('span'); t.className='t'; t.textContent=it.time; li.appendChild(t);
    }
    const w=document.createElement('span'); w.textContent=it.what; li.appendChild(w);
    tl.appendChild(li);
  });

  const nl=document.getElementById('notes'); nl.innerHTML='';
  const notes=(data.notes||[]).map(n=>String(n||'').trim()).filter(Boolean);
  if(!notes.length){ nl.appendChild(emptyRow('No notes today.')); }
  notes.forEach(n=>{ const li=document.createElement('li'); li.textContent=n; nl.appendChild(li); });

  const cal=document.getElementById('cal'); cal.innerHTML='';
  const win=calendarWindow(data.calendar,todayISO);
  win.past.forEach(e=>cal.appendChild(calRow(e,todayISO,true)));
  const div=document.createElement('li'); div.className='divider';
  const lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent='TODAY';
  const rule=document.createElement('span'); rule.className='rule';
  div.appendChild(lbl); div.appendChild(rule); cal.appendChild(div);
  if(!win.ahead.length){ cal.appendChild(emptyRow('Nothing on the calendar yet.')); }
  win.ahead.forEach(e=>cal.appendChild(calRow(e,todayISO,false)));

  document.getElementById('reassure').textContent =
    data.reassure || 'Everything is okay. You are safe and loved.';
}

/* 4. CLOCK + date line. Keeps the header on ONE line for every possible
   date ("Today is Wednesday, September 24." is the widest case). */
function fitLine(el,max,min){
  el.style.fontSize=max+'px';
  for(let s=max; s>min && el.scrollWidth>el.clientWidth; ){ s-=1; el.style.fontSize=s+'px'; }
}
let shownDate=null;
function tick(){
  const now=new Date();
  document.getElementById('clock').textContent=fmtTime.format(now);
  const line='Today is '+fmtToday.format(now)+'.';
  if(line!==shownDate){                     // also catches midnight rollover
    shownDate=line;
    const el=document.getElementById('today-is');
    el.textContent=line;
    fitLine(el,54,38);
    render(DATA);                           // re-evaluate past/upcoming
  }
}

/* 5. FIT — scale the 1280x720 stage to the real screen */
function fit(){
  const stage=document.querySelector('.stage');
  stage.style.transform='scale('+Math.min(window.innerWidth/1280,window.innerHeight/720)+')';
}

/* 6. BOOT */
window.addEventListener('resize',function(){ fit(); fitLine(document.getElementById('today-is'),54,38); });
fit(); render(DATA); tick();
setInterval(tick,1000);   // live clock + automatic date rollover at midnight

/* --- Seams for the wiring step (not needed for the static test) ---
   Data refresh: setInterval(loadData, 3*60*1000)   // fetch sheet every 3 min
   Full reload : setInterval(()=>location.replace('?v='+Date.now()), 60*60*1000)
   loadData(): fetch endpoint (cache-bust with ?t=Date.now()), take the "Days"
   row whose date === today's LA date plus the whole "Events" tab, render().
   On fetch failure keep the last known GOOD state; if there is no row for
   today, fall back to date + reassurance + "Nothing planned today."
------------------------------------------------------------------ */
</script>
</body>
</html>
