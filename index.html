     drop-the-whole-line-if-expired rule: these messages are dated by their
     until-instant, so they do not need the countdown to date them, and
     suppressing one over a single stale token would be the wrong failure.
     Only an expansion to nothing means there is nothing to say. */
  return expandDays(msg,todayISO).text;
}
/** The takeover. '' means "no takeover, render the board". */
function activeFocus(todayISO,now){
  return activeTimedMsg(focusMsg,focusUntilMs,focusForDate,todayISO,now);
}
/** The rotating one. '' means "nothing for the rotation to show". Note this
 *  says nothing about whether a moment may run right now — that is
 *  momentBlockedBy()'s job, and a focus takeover suppresses this too. */
function activeGentle(todayISO,now){
  return activeTimedMsg(gentleMsg,gentleUntilMs,gentleForDate,todayISO,now);
}

function nightMessage(todayISO){
  const raw=String(settings.night||'').trim()||DEFAULT_NIGHT;
  return expandDays(raw,todayISO).text||DEFAULT_NIGHT;
}

/* Selection order, top to bottom. One place, so the modes cannot drift apart.

   The two axes are chosen INDEPENDENTLY. Palette is settled first and applies
   whatever happens next; layout is then chosen on its own. That is why a dark
   full board exists at all: it is not a mode anybody added, it is what falls
   out of asking the two questions separately instead of together. */
function selectMode(now,todayISO){
  const night=isNight(now);                     /* axis 1: palette */
  const focus=activeFocus(todayISO,now);

  /* A takeover is a takeover on every screen, in whatever palette that screen
     currently warrants — dark at 3am, warm at 2pm. Unchanged by this split. */
  if(focus) return { mode:'focus', layout:'single', night:night, message:focus };

  if(night){                                    /* axis 2: layout, per screen */
    if(screenMode().nightLayout==='single')
      return { mode:'night', layout:'single', night:true,
               message:nightMessage(todayISO) };
    /* The living-area case: same board, same content, dimmed. No message —
       there is nothing to say that the board is not already saying. */
    return   { mode:'night', layout:'full',   night:true, message:'' };
  }
  return     { mode:'day',   layout:'full',   night:false, message:'' };
}
function modeKey(m){
  return m.mode+'|'+m.layout+'|'+(m.night?'n':'d')+'|'+m.message;
}

/* Both axes land on <html> as data attributes, separately, because they ARE
   separate. data-palette is what the CSS reads. data-layout is not styled
   today, but it is what makes the expected palette split cheap: if one night
   palette cannot serve both a glanced-at bedroom line and a read-at-32-inches
   full board, the override is a single extra CSS block keyed on
   [data-palette="night"][data-layout="full"] — no JS change at all.
   data-mode is styled by nothing and exists so the current state is legible
   from outside (devtools, ?debug=1, the headless harness) rather than being
   locked inside a closure variable. */
function applyMode(m){
  const root=document.documentElement;
  root.setAttribute('data-palette',m.night?'night':'day');
  root.setAttribute('data-layout',m.layout);
  root.setAttribute('data-mode',m.mode);
  /* Ask Silk to tint its navigation bar to match. See the meta tag in <head>
     for why this is a request rather than a fix. Read back from the computed
     --paper so it always follows whichever palette block actually won,
     including the deeper bedroom one — one source of truth, no second list of
     colours to keep in step. */
  const meta=document.getElementById('theme-color');
  if(meta){
    const bg=getComputedStyle(root).getPropertyValue('--paper').trim();
    if(bg) meta.setAttribute('content',bg);
  }
}

/* 8. PHOTO MOMENTS — an occasional overlay, never a mode of selectMode().
   ------------------------------------------------------------------------
   Deliberately NOT wired into selectMode()/paint(). Everything else in that
   system is "what does the board currently CLAIM" — day board, night text,
   a focus takeover — and selectMode() runs on every paint precisely because
   those answers must always be current. A photo moment claims nothing; it is
   a decoration laid OVER whatever the board is currently saying, and it has
   its own timers because its lifecycle (preload, hold, fade) does not fit
   the instant-in/instant-out shape paint() already handles well. Keeping it
   a separate system is what lets it interrupt cleanly without selectMode()
   ever having to know it exists.

   SAFETY MODEL — read this before changing any timer below.
   1. A moment always returns to the board. beginPhotoMoment() sets a
      MOMENT_HARD_CAP_MS backstop the instant anything becomes visible,
      independent of the normal hold-then-fade path. If the normal path is
      ever wrong — a bug, a hung transitionend that never fires, anything —
      the hard cap still tears the overlay down. Same structural guarantee as
      a focus takeover's until-instant, applied to a timer instead of a clock
      comparison, because there is no wall-clock deadline to compare against
      here, only "how long has this been up".
   2. NEVER over a focus message, and NEVER on a screen in night mode unless
      its SCREEN_MODES entry has nightMoments:true (table and living room do;
      the bedroom does not, so its dark screen stays dark).
      momentBlockedBy() is the single gate for EVERY kind of moment, with
      photoBlockedBy() adding the one condition that is media's alone (the
      master switch) — checked before starting a moment, checked AGAIN at the
      moment of reveal (a preload can take a few seconds — long enough for a
      focus message to land while waiting), and checked every second via
      checkMomentInterrupt() while one is showing, so a transition into any of
      those states mid-moment fades it out immediately rather than waiting for
      it to finish on its own. A gentle message gets one extra check in that
      last place: its own until-instant, so it can never finish a hold it has
      stopped being true for.
   3. A photo that fails to decode is skipped SILENTLY. No broken-image icon
      ever reaches the screen, because nothing is ever assigned to the real
      <img>'s src until a preload has already fully succeeded — see
      beginPhotoMoment(). The board simply stays exactly as it was.
   4. The caption asserts nothing. It is warmth/orientation text only
      ("Kathy, your daughter — 2024"), never a status or instruction — that
      is a Sheet-authoring convention this code cannot enforce, so it is
      written here for whoever edits the Media tab. This is also why a gentle
      message is its own kind of moment rather than being shoved into the
      caption slot of a photo: the caption's whole contract is that it never
      tells her anything is the case.
   5. ONE moment at a time, structurally. One scheduler, one overlay, one
      momentState, and attemptMoment() returns immediately unless that state
      is 'idle'. A photo and a gentle message cannot both be on screen, and
      neither can two of either. Nothing arbitrates between them at paint
      time because nothing has to. */

/* The master switch is checked fresh every attempt, never cached — that is
   what makes it a same-fetch, no-redeploy "bad day" off: settings refreshes
   every ~3 minutes like everything else, and the very next scheduling
   attempt after it flips to anything but "on" simply does nothing. */

/** A Media row's Screens allow-list. Blank means every screen, bedroom
 *  included — the bedroom's night protection is the time gate in
 *  photoBlockedBy(), not this list. */
function screenEligibleForPhoto(photo){
  const list=photo&&photo.screens;
  if(!list||!list.length) return true;      /* blank = eligible everywhere */
  return list.indexOf(SCREEN)>=0;
}
function eligiblePhotos(){
  const now=Date.now();
  return (mediaList||[]).filter(function(p){
    if(!p||!p.file) return false;
    if(!screenEligibleForPhoto(p)) return false;
    /* De-prioritised, not permanently excluded — a network blip should not
       blacklist a real photo forever, only stop it stealing every turn. */
    const failedAt=mediaFailedAt[p.file];
    if(failedAt&&(now-failedAt)<MEDIA_FAIL_COOLDOWN_MS) return false;
    return true;
  });
}
function shuffleArr(a){
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=b[i]; b[i]=b[j]; b[j]=t;
  }
  return b;
}
/** Shuffle-without-immediate-repeat, soft preference. Compared by FILE, not
 *  object identity — mediaList is replaced wholesale by every fetch, so two
 *  "the same photo" entries a few minutes apart are different object
 *  instances and an identity check would silently stop noticing repeats. */
function pickNextPhoto(){
  const pool=eligiblePhotos();
  if(!pool.length) return null;
  if(!mediaQueue.length){
    mediaQueue=shuffleArr(pool);
    if(mediaQueue.length>1&&mediaQueue[0].file===mediaLastShownFile){
      const tmp=mediaQueue[0]; mediaQueue[0]=mediaQueue[1]; mediaQueue[1]=tmp;
    }
  }
  /* The pool can have moved since the queue was built (a Sheet edit, a
     cooldown clearing); drop anything no longer eligible rather than show it. */
  while(mediaQueue.length){
    const next=mediaQueue.shift();
    if(pool.some(function(p){ return p.file===next.file; })) return next;
  }
  return null;
}

/** The gate EVERY moment passes, whatever kind it is. '' means allowed; the
 *  reason is returned rather than a boolean so ?debug=1 can say WHY a screen
 *  is quiet instead of only that it is. */
function momentBlockedBy(now,todayISO){
  if(isNight(now)&&!screenMode().nightMoments) return 'night';
  if(activeFocus(todayISO,now)) return 'focus';
  return '';
}
/** The same, plus the one condition that is media's alone: the master switch.
 *  A gentle message deliberately does NOT sit behind it — media=off is a "no
 *  photographs today" switch, and it should not also silence somebody saying
 *  where they are. See the GENTLE MESSAGES block. */
function photoBlockedBy(now,todayISO){
  if(!mediaEnabled()) return 'media off';
  return momentBlockedBy(now,todayISO);
}
function noteMoment(what){ momentLast=what; momentLastAt=Date.now(); }

/* How often the ONE scheduler wakes up: the faster of the two cadences while
   a gentle message is live, the photo cadence otherwise. A live gentle
   message therefore TIGHTENS the whole rotation rather than adding a second
   timer alongside it — photos keep their own slower clock (photoDueAt) and
   simply take the slots they are due for. */
function momentEveryMin(){
  const media=clampMediaEveryMin(settings.mediaeverymin);
  const now=deviceNow();
  if(!activeGentle(isoLA(now),now)) return media;
  return Math.min(media,clampGentleEveryMin(settings.gentleeverymin));
}
function scheduleNextMomentAttempt(){
  if(momentTimer) clearTimeout(momentTimer);
  const everyMin=momentEveryMin();
  /* +-15% jitter so moments don't feel mechanical; the floor is re-applied
     AFTER jitter so an unlucky low draw can never undercut the safety rail. */
  const jitter=1+((Math.random()*2-1)*0.15);
  const delayMs=Math.max(Math.round(everyMin*60000*jitter),MOMENT_EVERY_MIN_FLOOR*60000);
  momentArmedEveryMin=everyMin;
  momentNextAt=Date.now()+delayMs;
  momentTimer=setTimeout(attemptMoment,delayMs);
}
/* A due-time is set a little SHORT of the full cadence, because the tick that
   will serve it is itself jittered by up to -15%. Without the slack a photo
   whose next tick landed early would find itself not-quite-due, lose the slot
   and wait a whole extra cadence — which would quietly halve how often photos
   appear, roughly half the time. 0.8 covers the jitter with margin, and in the
   no-gentle-message case it makes "is a photo due" true at every tick, i.e.
   exactly the behaviour this scheduler had before it had two clocks. */
const MOMENT_DUE_SLACK = 0.8;
/* Date.now(), NOT deviceNow(). A due-time is a stopwatch — how long since the
   last one of these — so it belongs on the same unskewed clock the scheduler
   itself runs on (momentNextAt, momentLastAt, shortIn), never on the
   server-corrected one. Mixing the two is not a rounding error: clockSkewMs on
   a drifting Fire TV, or under a ?now= test hook, can be hours, which would
   make every due-time permanently in the past and hand every single slot to
   whichever kind is checked first. The skewed clock is for deciding what is
   TRUE (dates, until-instants); the raw clock is for deciding what is NEXT. */
function dueIn(everyMin){ return Date.now()+Math.round(everyMin*60000*MOMENT_DUE_SLACK); }

function attemptMoment(){
  scheduleNextMomentAttempt();      /* always line up the NEXT opportunity first, */
  if(momentState!=='idle') return;  /* whatever this attempt itself does — one moment at a time */
  const now=deviceNow(), todayISO=isoLA(now);
  const t=Date.now();               /* the scheduler clock — see dueIn() */

  /* Decide what this slot is FOR before committing to it. Asking "could a
     photo actually run right now" — not merely "is one due" — is what stops a
     permanently-due photo (media switched off, an empty pool, a screen with
     no eligible rows) from silently eating every slot the gentle message
     should have had. A due-but-impossible photo is not a photo. */
  const photoBlocked=photoBlockedBy(now,todayISO);
  const photoReady=(t>=photoDueAt)&&!photoBlocked&&!!eligiblePhotos().length;

  const momentBlocked=momentBlockedBy(now,todayISO);
  const gentleText=momentBlocked?'':activeGentle(todayISO,now);
  const gentleReady=!!gentleText&&(t>=gentleDueAt);

  /* A photo wins a tie, deliberately. It is the rarer event and there are only
     a handful of them; the gentle message comes back round within minutes by
     construction, so yielding a slot costs it almost nothing and starves it of
     nothing — its own due-time stays passed, so it takes the very next slot. */
  if(photoReady){
    photoDueAt=dueIn(clampMediaEveryMin(settings.mediaeverymin));
    const photo=pickNextPhoto();
    if(photo){ noteMoment('loading '+photo.file); beginPhotoMoment(photo); return; }
  }
  if(gentleReady){
    gentleDueAt=dueIn(clampGentleEveryMin(settings.gentleeverymin));
    beginGentleMoment(gentleText);
    return;
  }
  /* Silent, and a normal, frequent outcome. Named for ?debug=1 only — the
     board looks identical whichever of these it was. The gate that stops
     EVERYTHING is the headline when it applies; otherwise both sides report,
     because "why is this screen quiet" has two independent answers now and
     naming only one of them is how you chase the wrong thing from 5,000
     miles away. */
  noteMoment('skipped: '+(momentBlocked||
    ('photo '+(photoBlocked||(eligiblePhotos().length?'not due':'none eligible'))+
     ', gentle '+(gentleText?'not due':'none'))));
}

/** new Image() + decode(), never the real on-screen <img>, so a failure never
 *  touches anything visible. Resolves only once the browser has actually
 *  finished decoding, not merely fetched — decode() is what stands between
 *  this and a half-painted first frame on a slow connection. */
function preloadPhoto(url){
  return new Promise(function(resolve,reject){
    const img=new Image();
    let settled=false;
    const timer=setTimeout(function(){
      if(settled) return; settled=true; reject(new Error('timeout'));
    },PHOTO_DECODE_TIMEOUT_MS);
    function ok(){
      if(settled) return; settled=true; clearTimeout(timer);
      if(img.decode){ img.decode().then(function(){ resolve(img); }).catch(function(){ resolve(img); }); }
      else resolve(img);
    }
    function fail(){
      if(settled) return; settled=true; clearTimeout(timer); reject(new Error('load-error'));
    }
    img.onload=ok; img.onerror=fail;
    img.src=url;
  });
}

function beginPhotoMoment(photo){
  const url=mediaUrlFor(photo.file);
  if(!url){ return; }
  momentState='loading';
  const token=++photoLoadToken;
  preloadPhoto(url).then(function(img){
    if(token!==photoLoadToken) return;   /* superseded — an interrupt already reset us */
    revealPhoto(photo,img);
  }).catch(function(){
    if(token!==photoLoadToken) return;
    /* SKIP SILENTLY. Never a broken-image icon, never a blank board — the
       board simply stays exactly as it already was. */
    mediaFailedAt[photo.file]=Date.now();
    noteMoment('FAILED to load '+photo.file);
    momentState='idle';
  });
}

function revealPhoto(photo,img){
  /* Re-checked here, not just at the decision to start: a preload can take a
     few seconds, long enough for a focus message to land or the night window
     to open while this was in flight. */
  const now=deviceNow(), todayISO=isoLA(now);
  const blocked=photoBlockedBy(now,todayISO);
  if(blocked){ noteMoment('skipped at reveal: '+blocked); momentState='idle'; return; }

  const momentEl=document.getElementById('moment');
  const imgEl=document.getElementById('photo-img');
  const capBox=document.getElementById('photo-cap-box');
  const capEl=document.getElementById('photo-cap');

  /* Each reveal puts the overlay into ITS shape rather than trusting whatever
     the last moment left behind. endMoment() already resets to the photo
     shape, so this is belt and braces — and it is what lets either kind of
     moment follow either kind without a special case. */
  document.getElementById('moment-img-wrap').hidden=false;
  document.getElementById('moment-msg-box').hidden=true;

  imgEl.src=img.src;         /* already fully decoded — this paint is instant */
  const caption=String(photo.caption||'').trim();
  if(caption){
    setTextWithBreaks(capEl,caption);
    capBox.style.display='flex';
    fitMessage('photo-cap-box','photo-cap',PHOTO_CAP_MAX,PHOTO_CAP_MIN);
  }else{
    capEl.textContent=''; capBox.style.display='none';
  }

  mediaLastShownFile=photo.file;
  noteMoment('shown '+photo.file);
  momentKind='photo';
  momentState='showing';
  /* Two rAFs, not one: the opacity:0 state needs a full style/layout pass
     committed before .show is added, or the very first paint can already
     land mid-transition and the fade reads as a hard cut on a fast machine. */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      if(momentState==='showing') momentEl.classList.add('show');
    });
  });

  const holdMs=clampMediaHoldSec(settings.mediaholdsec)*1000;
  clearTimeout(momentHoldTimer);
  momentHoldTimer=setTimeout(beginMomentFadeOut,holdMs);
  /* The backstop. Armed the instant anything becomes visible; see the safety
     model comment above this whole section for why it is independent of the
     hold timer rather than derived from it. */
  clearTimeout(momentHardCapTimer);
  momentHardCapTimer=setTimeout(forceEndMoment,MOMENT_HARD_CAP_MS);
}

/* A gentle message needs no preload, so it has no 'loading' state and no
   token: the text is already here, and the only thing between deciding to
   show it and it being on screen is a layout pass. Everything AFTER that
   point — hold, fade, hard cap, interrupt — is the same machinery a photo
   uses, which is the entire reason this is a moment and not a mode. */
function beginGentleMoment(text){
  const momentEl=document.getElementById('moment');
  document.getElementById('moment-img-wrap').hidden=true;
  document.getElementById('photo-cap-box').style.display='none';
  const box=document.getElementById('moment-msg-box');
  box.hidden=false;
  setTextWithBreaks(document.getElementById('moment-msg'),text);
  /* Fitted with the SAME machinery as a takeover and a caption, against a
     lower ceiling — see GENTLE_MSG_MAX. Measured after the box is un-hidden:
     a hidden box has no height, and auto-fitting against one is exactly how a
     layout silently collapses to its minimum type size. */
  fitMessage('moment-msg-box','moment-msg',GENTLE_MSG_MAX,MSG_MIN);

  momentKind='gentle';
  momentState='showing';
  noteMoment('gentle shown');
  /* Two rAFs, not one — same reason as revealPhoto(): the opacity:0 state
     needs a full style/layout pass committed before .show is added, or the
     fade reads as a hard cut on a fast machine. */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      if(momentState==='showing') momentEl.classList.add('show');
    });
  });

  const holdMs=clampGentleHoldSec(settings.gentleholdsec)*1000;
  clearTimeout(momentHoldTimer);
  momentHoldTimer=setTimeout(beginMomentFadeOut,holdMs);
  /* The same backstop a photo gets, for the same reason. */
  clearTimeout(momentHardCapTimer);
  momentHardCapTimer=setTimeout(forceEndMoment,MOMENT_HARD_CAP_MS);
}

function beginMomentFadeOut(){
  if(momentState!=='showing') return;
  momentState='fading-out';
  document.getElementById('moment').classList.remove('show');
  clearTimeout(momentHoldTimer);
  clearTimeout(momentFadeOutTimer);
  momentFadeOutTimer=setTimeout(endMoment,MOMENT_FADE_MS+250);
}
/** The only place that actually tears everything down, reachable from the
 *  normal path (after the fade completes) OR the hard cap (from ANY state).
 *  Always leaves the board clean: no lingering src, no stale caption, no
 *  visible overlay, whatever was interrupted mid-flight. */
function endMoment(){
  photoLoadToken++;      /* invalidates any preload still in flight */
  clearTimeout(momentHoldTimer); clearTimeout(momentFadeOutTimer); clearTimeout(momentHardCapTimer);
  momentHoldTimer=momentFadeOutTimer=momentHardCapTimer=null;
  const momentEl=document.getElementById('moment');
  momentEl.classList.remove('show');
  const imgEl=document.getElementById('photo-img');
  imgEl.removeAttribute('src'); imgEl.src='';
  document.getElementById('photo-cap').textContent='';
  document.getElementById('photo-cap-box').style.display='none';
  /* The message half, torn down the same way and left in the photo-shaped
     default: no stale sentence sitting in the DOM at opacity:0 waiting for
     the next fade-in to reveal it. */
  document.getElementById('moment-msg').textContent='';
  document.getElementById('moment-msg-box').hidden=true;
  document.getElementById('moment-img-wrap').hidden=false;
  momentKind='';
  momentState='idle';
}
function forceEndMoment(){ endMoment(); }   /* named for what fired it, under ?debug=1 */

/** Called every second from tick(). A 'loading' moment needs no action here —
 *  revealPhoto()'s own re-check already refuses to show anything that has
 *  stopped being allowed while it was decoding — so this only ever acts on
 *  a moment already on screen. */
function checkMomentInterrupt(now,todayISO){
  if(momentState!=='showing') return;
  if(momentKind==='gentle'){
    /* Two reasons to pull it, and the second is the one that matters: a
       gentle message reaches its until-instant exactly as a takeover does,
       and it must not sit out a hold it has stopped being true for. Checked
       on the clock, every second, with no network — same as the takeover. */
    if(momentBlockedBy(now,todayISO)||!activeGentle(todayISO,now)) beginMomentFadeOut();
    return;
  }
  if(photoBlockedBy(now,todayISO)) beginMomentFadeOut();
}

/* 9. PAINT — assemble what to show from whatever state we have */
function paint(){
  const now=deviceNow();
  const todayISO=isoLA(now);
  const model=safeFallback();

  if(DEMO){
    model.today=DEMO_DATA.today; model.notes=DEMO_DATA.notes;
    model.calendar=DEMO_DATA.calendar;
    model.reassure=DEMO_DATA.reassure;
  }else{
    /* Dated events survive regardless of the day row's age. */
    if(events&&events.list) model.calendar=events.list;
    model.reassure=settings.reassure||DEFAULT_REASSURE;

    /* The day row is only usable if it is actually for TODAY. At midnight
       this goes false on its own and the board empties until the next
       fetch — which tick() triggers immediately on the date change. */
    if(dayRow&&dayRow.forDate===todayISO){
      model.today=dayRow.today||[];
      model.notes=(dayRow.notes||[]).concat(settings.notes?[settings.notes]:[]);
      if(dayRow.reassure) model.reassure=dayRow.reassure;
    }else if(settings.notes){
      model.notes=[settings.notes];
    }
  }

  model.today=expandList(model.today,todayISO);
  model.notes=expandList(model.notes,todayISO);

  /* Say so quietly when the data has stopped arriving. One line, no alarm,
     and only once it is old enough to matter. */
  if(lastOkAt&&(Date.now()-lastOkAt)>STALE_NOTE_MS){
    model.reassure=model.reassure+'   ·   Updated '+
      fmtTime.format(new Date(lastOkAt+clockSkewMs));
  }

  const m=selectMode(now,todayISO);
  shownMode=modeKey(m);            /* tick() repaints when this changes */
  applyMode(m);
  if(m.layout==='single'){
    /* Focus keeps the normal reassurance line and the full ceiling; night
       deliberately has neither. */
    const focus=(m.mode==='focus');
    renderSingle(m.message, focus?model.reassure:'', focus?MSG_MAX:MSG_MAX_NIGHT);
  }else{
    renderFull(model,todayISO);
  }
}

/* 10. CLOCK + date line + mode changes */
let shownDate=null;
let shownMode=null;
function tick(){
  const now=deviceNow();
  const todayISO=isoLA(now);
  document.getElementById('clock').textContent=fmtTime.format(now);
  const line='Today is '+fmtToday.format(now)+'.';
  /* Checked every second regardless of which branch below runs — a photo
     moment interrupt must not wait on the once-a-day date-line branch, and a
     photo can be showing on any ordinary second. */
  checkMomentInterrupt(now,todayISO);
  if(line!==shownDate){                     /* also catches midnight rollover */
    const firstPaint=(shownDate===null);
    shownDate=line;
    const el=document.getElementById('today-is');
    el.textContent=line;
    fitHeader();
    paint();                                /* re-evaluate past/upcoming */
    if(!firstPaint) loadData();             /* new day: get its row now   */
    return;
  }
  /* Both mode switches are driven by the clock and by nothing else, so they
     have to be checked on the clock rather than waiting for the next fetch or
     the 60-second staleness repaint. Checked every second, repainted only when
     the answer actually changes — a focus message must vanish AT its
     until-time, not up to a minute afterwards, and with no network at all. */
  const k=modeKey(selectMode(now,todayISO));
  if(k!==shownMode) paint();
}

/* 11. SCREEN WAKE LOCK — an EXPERIMENT, not a fix.
   OPERATIONS.md is explicit that page activity does not keep a Fire TV awake:
   this board already ticks a clock every second, fetches every three minutes
   and reloads hourly, and the 4K Select idled anyway. The sleeping panel is a
   device-layer problem and this is NOT the cure for it.

   The only purpose here is to answer one open question with evidence: does
   Silk implement navigator.wakeLock at all, and if it grants a lock does the
   system take it straight back? The answer shows under ?debug=1 so it can be
   read from across the room or through a camera.

   UNSUPPORTED or an immediate release is a perfectly good result — a clean
   negative closes the question. */
let wakeState='INIT', wakeSince=0, wakeReleases=0, wakeDetail='', wakeLock=null;

function wakeSupported(){
  return !!(window.navigator && navigator.wakeLock && navigator.wakeLock.request);
}
function requestWakeLock(){
  if(!wakeSupported()){ wakeState='UNSUPPORTED'; return; }
  if(wakeLock) return;                       /* already holding one */
  /* A lock can only be taken by a VISIBLE document; asking while hidden throws
     and would report a misleading DENIED. */
  if(document.hidden){ wakeState='HIDDEN'; return; }
  try{
    navigator.wakeLock.request('screen').then(function(sentinel){
      wakeLock=sentinel; wakeState='ACTIVE'; wakeSince=Date.now(); wakeDetail='';
      sentinel.addEventListener('release',function(){
        wakeLock=null; wakeReleases++; wakeState='RELEASED';
        /* Deliberately NOT re-requested here. The system reclaiming it
           immediately is the interesting finding; papering over it with an
           instant retry would hide the very thing we are measuring. The slow
           retry below picks it up, and the release COUNT is the evidence. */
      });
    }).catch(function(err){
      wakeLock=null; wakeState='DENIED'; wakeDetail=(err&&err.name)||String(err);
    });
  }catch(err){
    wakeLock=null; wakeState='DENIED'; wakeDetail=(err&&err.name)||String(err);
  }
}

/* 12. FULLSCREEN — a second EXPERIMENT, this one aimed specifically at
   Silk's own chrome, not at Fire TV sleep.

   theme-color (see <head>) asked Silk to TINT its blue navigation bar to match
   the palette. Confirmed on hardware: Silk ignores it — the bar stayed blue.
   That is a colour the page does not control.

   Fullscreen is the other lever a web page has over browser chrome, and it is
   a different kind of request: not "recolour your bar" but "get rid of it".
   Many mobile/TV browsers collapse their UI entirely in fullscreen. If Silk
   does, the bar is not tinted — it is GONE, and the stage also gets back
   whatever height it was costing (see fit(), which currently treats that loss
   as a fact of life).

   SCOPED TO THE BEDROOM SCREEN ONLY, deliberately. This is the one screen the
   darkness matters for, and — as importantly — the one screen with no
   hardware yet, so an unproven browser-chrome experiment carries zero risk to
   a display that is already working unattended. It is never attempted on the
   table or living room, and how it behaves around the Fire TV idle/HOME
   recovery path (see OPERATIONS.md) is untested — one more reason to keep it
   off the two screens that cannot afford a new failure mode.

   Fullscreen almost always requires a user gesture, and this page is never
   clicked — nobody is holding a remote at a menu. The boot-time request is
   expected to be refused for exactly that reason; it still runs, because
   Silk's policy here is unknown and a refusal is a clean, informative
   negative — same posture as the wake lock above. The keydown/pointerdown
   listeners exist for the one case that could turn it from a negative into a
   result: if the remote ever delivers a real input event to the page (an
   accidental button press), a request made from INSIDE that handler is a
   genuine user gesture and has a real chance where the boot-time one did not.

   Unlike the wake lock, this DOES re-request itself promptly on drop — the
   goal here is a working outcome, not an instrument for measuring how often
   the system reclaims something. fsDrops is kept only as a diagnostic. */
let fsState='INIT', fsDetail='', fsDrops=0;
function fsApplies(){ return SCREEN==='bedroom'; }
function fsElement(){
  return document.fullscreenElement||document.webkitFullscreenElement||
         document.mozFullScreenElement||document.msFullscreenElement||null;
}
function requestFullscreenExperiment(){
  if(!fsApplies()) return;
  if(fsElement()){ fsState='ACTIVE'; return; }
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||
            el.mozRequestFullScreen||el.msRequestFullscreen;
  if(!req){ fsState='UNSUPPORTED'; return; }
  try{
    const r=req.call(el);
    if(r&&r.then){
      r.then(function(){ fsState='ACTIVE'; fsDetail=''; })
       .catch(function(err){ fsState='DENIED'; fsDetail=(err&&err.name)||String(err); });
    }
    /* Some prefixed implementations return undefined rather than a promise;
       the fullscreenchange listener below is what actually settles those. */
  }catch(err){ fsState='DENIED'; fsDetail=(err&&err.name)||String(err); }
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
  .forEach(function(evt){
    document.addEventListener(evt,function(){
      if(!fsApplies()) return;
      if(fsElement()){ fsState='ACTIVE'; }
      else{ if(fsState==='ACTIVE') fsDrops++; fsState='RELEASED'; }
    });
  });

/* 13. ?debug=1 READOUT — diagnostics for a screen nobody can walk up to. */
let dbgEl=null;
function shortAgo(ms){
  if(!ms) return 'never';
  const s=Math.max(0,Math.round((Date.now()-ms)/1000));
  if(s<90) return s+'s';
  const m=Math.round(s/60);
  return m<90 ? m+'m' : Math.round(m/60)+'h';
}
function shortIn(ms){
  const s=Math.max(0,Math.round((ms-Date.now())/1000));
  return s<90 ? 'in '+s+'s' : 'in '+Math.round(s/60)+'m';
}
function debugPaint(){
  if(!DEBUG) return;
  if(!dbgEl){
    dbgEl=document.createElement('div'); dbgEl.id='debug';
    document.body.appendChild(dbgEl);      /* body, NOT .stage — see the CSS */
  }
  const age=(wakeState==='ACTIVE'&&wakeSince)?' '+shortAgo(wakeSince):'';
  const why=wakeDetail?' ('+wakeDetail+')':'';
  /* The mode is the first thing to check when a screen "looks wrong" from
     5,000 miles away — dark when it should be light means night mode, not a
     dying panel. Shown with the until-time so a takeover's own deadline is
     legible through a camera. */
  /* mode AND layout: "night full" and "night single" are different answers to
     "why does that screen look like that", and from a camera they are the two
     you most need to tell apart. */
  const parts=String(shownMode||'').split('|');
  const mode=parts[0]+(parts[1]?' '+parts[1]:'');
  /* No skew added: focusUntilMs is already an absolute instant from the
     server, unlike lastOkAt which is a local Date.now() stamp. */
  const until=(parts[0]==='focus'&&focusUntilMs)?
              ' till '+fmtTime.format(new Date(focusUntilMs)):'';
  /* Only printed on the one screen the experiment runs on \u2014 a blank line
     here would just be noise on the table or living room. */
  const fsWhy=fsDetail?' ('+fsDetail+')':'';
  const fsLine=fsApplies()?'\nFULL '+fsState+fsWhy+'   drops '+fsDrops:'';
  /* momentState is not styled to be as terse as the rest of this line — a dark
     screen while `showing (photo)` reads is a plain photo moment, not a fault,
     and that distinction matters more here than density does. */
  /* The moment line answers "why isn't this screen showing anything" on its
     own: what the overlay is doing, when the next slot is, what the last
     attempt did, and how many photos this screen is actually allowed. The
     cadence printed is the SCHEDULER's — which a live gentle message pulls
     down — with the photo's own cadence after it, because "every 2m / photo
     80m" is the whole explanation for a board that is showing text often and
     pictures rarely. */
  const nowD=deviceNow(), todayD=isoLA(nowD);
  const blockedNow=photoBlockedBy(nowD,todayD);
  const next=momentTimer?shortIn(momentNextAt):'never (not armed)';
  const momentLine='\nMOMENT '+momentState+(momentKind?' ('+momentKind+')':'')+
    (blockedNow?'   photo ['+blockedNow+']':'')+
    '   next '+next+'   every '+momentEveryMin()+'m'+
    '   photo every '+clampMediaEveryMin(settings.mediaeverymin)+'m'+
    '   pool '+eligiblePhotos().length+'/'+(mediaList||[]).length+
    '   last '+momentLast+(momentLastAt?' '+shortAgo(momentLastAt)+' ago':'');
  /* Its own line, and printed even when there is no gentle message, because
     "nothing was typed" and "something was typed and is being suppressed" are
     the two answers this feature will actually be asked for, and from a camera
     they otherwise look identical. */
  const gLive=activeGentle(todayD,nowD);
  const gBlocked=momentBlockedBy(nowD,todayD);
  const gentleLine=!gentleMsg?'\nGENTLE none' :
    '\nGENTLE '+(gLive?(gBlocked?'live ['+gBlocked+']':'live'):'expired')+
    (gentleUntilMs?'   till '+fmtTime.format(new Date(gentleUntilMs)):'')+
    '   every '+clampGentleEveryMin(settings.gentleeverymin)+'m'+
    '   due '+((gLive&&!gBlocked)?shortIn(gentleDueAt):'-');
  /* The check-in line answers the two questions this feature will actually be
     asked from 5,000 miles away: is the strip even on, and did her press
     arrive. The date is printed because "on, but showing nothing" is the
     midnight-rollover case and it is otherwise indistinguishable from a
     broken endpoint. */
  const checkLine='\nCHECK '+(checkinsEnabled()?'on':'off')+
    (TEST_CHECKINS?' (url)':'')+
    (chipsDropped?' DROPPED(no room)':'')+
    '   poll '+Math.round(refreshMs()/1000)+'s'+
    '   for '+(logRow?logRow.forDate:'\u2014')+
    (logRow&&logRow.forDate!==todayD?' STALE':'')+
    '   '+CHECKINS.map(function(c){
      const at=todaysCheckIns(todayD)[c.kind];
      return c.kind.replace('medicine-','med ')+' '+
             ((typeof at==='number'&&at>0)?fmtTime.format(new Date(at)):'\u2014');
    }).join('  ');
  dbgEl.textContent=
    'WAKE '+wakeState+age+why+'   releases '+wakeReleases+fsLine+'\n'+
    SCREEN+'   data '+shortAgo(lastOkAt)+'   beat '+hbState+
    '   mode '+mode+until+
    '   '+window.innerWidth+'\u00d7'+window.innerHeight+momentLine+gentleLine+checkLine;
}

/* 14. FIT — fill the screen.
   Silk on the Fire TV keeps a top navigation bar, so the viewport is
   SHORTER than 720 CSS px. Scaling by min(w/1280, h/720) made height the
   binding constraint, which shrank everything and left black bars down
   both sides. Instead: always scale to the full WIDTH, and let the stage
   take whatever height the viewport actually offers. The auto-fit then
   absorbs the missing pixels as slightly smaller type rather than as
   letterboxing. Clamped so an extreme window can't produce a silly shape. */
const MIN_H=470, MAX_H=900;
let vScale=1;
function fit(){
  const stage=document.querySelector('.stage');
  let scale=window.innerWidth/1280;
  let h=window.innerHeight/scale;
  if(h<MIN_H){ h=MIN_H; scale=Math.min(scale,window.innerHeight/MIN_H); }
  else if(h>MAX_H){ h=MAX_H; }
  h=Math.round(h);
  vScale=Math.max(0.62,Math.min(1.15,h/720));
  stage.style.height=h+'px';
  stage.style.setProperty('--vs',vScale);
  stage.style.transform='scale('+scale+')';
}
/* Header type scales with the squeeze too, then shrinks further if a long
   date ("Today is Wednesday, September 24.") still would not fit on one line. */
function fitHeader(){
  fitLine(document.getElementById('today-is'),
          Math.round(72*vScale), Math.round(38*vScale));
}

/* 15. TEST HOOKS — see the flag block at the top. ?demo=1 only.
   The live board never converts an LA wall-clock time into an instant; the
   server does that, once, for focusUntil. This direction exists only so the
   night boundary and a focus expiry can be driven from a URL. Two passes,
   because the offset is itself a function of the instant: the first guess
   picks an offset, the second confirms it across a DST edge. */
function laLocalToEpoch(ymd,minutes){
  const base=Date.parse(ymd+'T00:00:00Z');
  if(!isFinite(base)) return null;
  const guess=base+minutes*60000;
  function offAt(t){
    const p=laParts(new Date(t));
    return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-t;
  }
  let t=guess-offAt(guess);
  const o2=offAt(t);
  if(guess-o2!==t) t=guess-o2;
  return t;
}
function applyTestHooks(){
  if(!DEMO) return;
  const t=paramOf('now').trim();
  if(t){
    const m=/^(\d{4}-\d{2}-\d{2})[T ](\d{1,2}):(\d{2})/.exec(t);
    const ms=m?laLocalToEpoch(m[1],(+m[2])*60+(+m[3])):null;
    /* Set as a SKEW, not a frozen time, so the clock goes on ticking from
       there and a boundary crossing can be watched happening. */
    if(ms!==null) clockSkewMs=ms-Date.now();
  }
  const nm=paramOf('nightmsg'); if(nm) settings.night=nm;
  const f=paramOf('focus');
  if(f){
    const today=isoLA(deviceNow());
    const raw=paramOf('focusuntil').trim();
    let until;
    if(/^\d{10,}$/.test(raw)) until=+raw;                 /* raw epoch ms    */
    else{
      const min=parseClockMin(raw);
      until=laLocalToEpoch(today,min===null?24*60:min);   /* blank -> day end */
    }
    setFocus(f,until,today);                              /* same path as a fetch */
  }
  /* Same parsing, same setter, same safety model — a gentle message forced
     from the URL is not a second kind of gentle message. */
  const gt=paramOf('gentle');
  if(gt){
    const today=isoLA(deviceNow());
    const raw=paramOf('gentleuntil').trim();
    let until;
    if(/^\d{10,}$/.test(raw)) until=+raw;                 /* raw epoch ms    */
    else{
      const min=parseClockMin(raw);
      until=laLocalToEpoch(today,min===null?24*60:min);   /* blank -> day end */
    }
    setGentle(gt,until,today);
  }
  const geh=paramOf('gentleeverymin'); if(geh) settings.gentleeverymin=geh;
  const ghh=paramOf('gentleholdsec'); if(ghh) settings.gentleholdsec=ghh;
  /* Photo moments are driven by a cadence measured in tens of minutes and a
     master switch that defaults off — neither is reachable by hand on a
     running board, same reasoning as night/focus above. */
  const mh=paramOf('media'); if(mh) settings.media=mh;             /* 'on' / 'off' */
  const meh=paramOf('mediaeverymin'); if(meh) settings.mediaeverymin=meh;
  const mhh=paramOf('mediaholdsec'); if(mhh) settings.mediaholdsec=mhh;
  /* "Show me one right now" without waiting out the cadence. Still goes
     through the normal gate (photoBlockedBy) — this bypasses the WAIT,
     not any of the safety checks, exactly like &focus= bypasses the Sheet
     edit but not the safety model around it. */
  if(/(^|[?&])photonow=1(&|$)/.test(location.search)){
    setTimeout(attemptMoment,50);
  }
  /* The gentle equivalent, and it cannot just call attemptMoment(): that
     hands a tie to the photo, so on a board with photos enabled &gentlenow=1
     would show a picture. This skips the SLOT ALLOCATION only — the gate and
     the expiry check are both still asked, exactly as attemptMoment() asks
     them. */
  if(/(^|[?&])gentlenow=1(&|$)/.test(location.search)){
    setTimeout(function(){
      const now=deviceNow(), todayISO=isoLA(now);
      const blocked=momentBlockedBy(now,todayISO);
      const text=blocked?'':activeGentle(todayISO,now);
      if(text&&momentState==='idle') beginGentleMoment(text);
      else noteMoment('gentlenow: '+(blocked||'no active gentle message'));
    },50);
  }
}

/* 16. BOOT */
/* Which screen this is, onto <html>, before the first paint — the bedroom's
   deeper night palette is a CSS selector on it, so it has to be there before
   anything renders. Never changes afterwards; ?screen= is fixed for the life
   of the page. */
document.documentElement.setAttribute('data-screen',SCREEN);
restore();
/* Demo mode never fetches (loadData() is a no-op under DEMO), so it needs its
   own seed for the photo pool — otherwise ?demo=1 would have nothing to show
   and the whole feature would look unbuilt rather than off. After restore(),
   so a real cached list (if this URL is ever opened without demo) can't leak
   into a demo session — demo content is always exactly DEMO_DATA. */
if(DEMO) mediaList=DEMO_DATA.media.slice();
/* Same reasoning as the media seed: DEMO never fetches, so without this the
   strip would be four grey chips in every demo and would look unbuilt rather
   than off. Stamped with TODAY's date, through the same setLog() a fetch uses
   — including its forDate guard — so the demo cannot show a state the real
   board could not. */
if(DEMO){
  const t=deviceNow(), base=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const seeded={};
  Object.keys(DEMO_DATA.checkins).forEach(function(k){
    seeded[k]=base.getTime()+DEMO_DATA.checkins[k]*60000;
  });
  setLog(seeded,isoLA(t));
}
applyTestHooks();             /* after restore(), so a hook always wins    */
fit();
tick();                       /* paints from restored/empty state at once */
loadData();
requestWakeLock();
requestFullscreenExperiment();  /* no-op unless SCREEN==='bedroom'          */
/* Every screen, bedroom included. At night the timer still fires but
   momentBlockedBy() returns 'night' and nothing is shown. */
scheduleNextMomentAttempt();
debugPaint();

setInterval(tick,1000);       /* live clock + date rollover at midnight   */
setInterval(loadData,refreshMs());     /* 60s on the table, 3 min elsewhere */
setInterval(paint,60*1000);   /* lets the staleness note appear on its own */
setInterval(debugPaint,1000); /* no-op without ?debug=1                   */
/* Slow retry only. Fast enough to recover a lock the system took back,
   slow enough that the release counter stays readable as evidence. */
setInterval(function(){
  if(wakeState!=='ACTIVE'&&wakeState!=='UNSUPPORTED') requestWakeLock();
},60*1000);
/* Faster retry than the wake lock's, on purpose: unlike that experiment this
   one wants a working outcome, not a slow-motion measurement, so a drop is
   picked back up within seconds rather than a minute. No-op off the bedroom. */
setInterval(function(){
  if(fsState!=='ACTIVE'&&fsState!=='UNSUPPORTED') requestFullscreenExperiment();
},5*1000);
/* The best chance this has: a real event delivered TO THE PAGE, which is the
   one thing that can make requestFullscreen count as user-gesture-initiated.
   Harmless to attach on every screen — fsApplies() gates the actual attempt,
   so this is inert everywhere except the bedroom. */
['keydown','pointerdown','click'].forEach(function(evt){
  document.addEventListener(evt,requestFullscreenExperiment);
});
/* The hourly reload must CARRY THE FLAGS. location.replace('?v=…') replaces
   the entire query string, so a display booted as ?screen=table would come
   back an hour later as an anonymous one and its heartbeat would move to the
   "unnamed" row — a fault that looks exactly like the TV having died. */
function reloadUrl(){
  const q=['v='+Date.now()];
  if(SCREEN&&SCREEN!=='unnamed') q.push('screen='+encodeURIComponent(SCREEN));
  if(DEBUG) q.push('debug=1');
  /* Carried like ?screen= and ?debug=, not like the demo hooks: this one is
     used on a live board, so losing it at the hourly reload would look exactly
     like the feature having broken. */
  if(TEST_CHECKINS) q.push('checkins=1');
  if(DEMO){
    q.push('demo=1');
    /* Carry the test hooks too, for the same reason: a demo window left open
       overnight must not quietly become a different test an hour later. */
    ['night','nightmsg','focus','focusuntil','now',
     'gentle','gentleuntil','gentleeverymin','gentleholdsec',
     'media','mediaeverymin','mediaholdsec'].forEach(function(k){
      const v=paramOf(k);
      if(v) q.push(k+'='+encodeURIComponent(v));
    });
  }
  return location.pathname+'?'+q.join('&');
}
setTimeout(function(){ location.replace(reloadUrl()); },RELOAD_MS);

/* fit() already reads window.innerHeight fresh every call, so a fullscreen
   entry/exit — which fires 'resize' — is handled by the SAME path as a Silk
   window resize, with no fullscreen-specific layout code needed. Getting the
   nav bar's height back is just a slightly taller viewport as far as fit() is
   concerned. */
window.addEventListener('resize',function(){ fit(); fitHeader(); paint(); debugPaint(); });
window.addEventListener('online',loadData);
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){ loadData(); requestWakeLock(); requestFullscreenExperiment(); }
});
</script>
</body>
</html>
