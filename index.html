<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Silk keeps its own navigation bar above the page and it is BLUE, which is
     the worst possible colour to leave glowing in a bedroom. The page cannot
     remove that bar — it is browser chrome, and the real fix is device-layer
     (see the WebView shell in OPERATIONS.md). But Chromium-based browsers tint
     their chrome from theme-color, and Silk is Chromium-based, so it costs
     nothing to ask. Kept in step with the current palette by applyMode().
     UNVERIFIED on Silk: if it is ignored the bar simply stays blue. -->
<meta name="theme-color" id="theme-color" content="#f6f2e9">
<title>Mom's Board</title>
<style>
  /* ============================================================
     Mom's Cognitive Support Display — live Google Sheet data
     Designed at 1280 x 720 and scaled to FILL whatever viewport it
     gets. Silk on the Fire TV keeps a nav bar, so the real viewport
     is short; the stage takes the height actually on offer and the
     vertical squeeze (--vs) plus per-box auto-fit absorb it, rather
     than letterboxing. No scrolling, no interaction required.

     TYPE SIZES ARE CEILINGS. Each box declares a --fs and JS steps
     it down only if the content would otherwise be clipped, so no
     amount of text typed into the Sheet can break the layout.
     ============================================================ */

  :root{
    --paper:#f6f2e9; --ink:#23201b; --muted:#7a7264; --soft:#5f584c;
    --line:#e2dccd; --card:#fffdf8;
    --done:#4f9c63;    --done-ink:#3f6b4b;   /* already happened      */
    --mark:#c08a20;                          /* "today" divider       */
    --note-ink:#2b4a66;                      /* numbers / upcoming    */

    /* The "recorded" green. Was kept dormant for the removed medication card;
       now live, as the pressed state of a check-in chip. */
    --ok-bg:#e3f1e4; --ok-ink:#245c33; --ok-edge:#4f9c63;
    --soon-bg:#fbeecf; --soon-ink:#6b4a12; --soon-edge:#d69a2c;
  }

  /* ---- NIGHT PALETTE -------------------------------------------------
     One of the two display axes (see the mode selection in the script).
     Same token NAMES, different values, so every rule below this point is
     palette-agnostic and neither layout has to know which palette it is in.

     Near-black ground with warm low-luminance amber text. Deliberately no
     white and no blue anywhere: both are more alerting and worse for sleep,
     which is the entire reason a screen dims at night rather than staying on
     the day board.

     THESE TEN VALUES ARE THE WHOLE PALETTE AND THEY ARE PROVISIONAL.
     Everything below reads them and nothing else hardcodes a night colour, so
     this block is the one place to adjust darkness and contrast. They have
     never been seen on a television in a dark room; they were chosen against
     a monitor, which is not the test.

     The tuning tension, stated so nobody has to rediscover it: this palette
     was designed for the BEDROOM, a glance-if-you-look screen where legibility
     is traded away for darkness on purpose. The table is the opposite — she
     ACTIVELY READS it at about 32 inches with aging eyes, and it is her
     primary anchor. Amber on near-black at reading sizes across a full board
     may well be harder for her than the crisp day palette, and "less
     off-putting in the evening" must not quietly cost her readability on the
     one screen that matters most.

     One palette is deliberately all that is built. If it turns out one cannot
     serve both, the expected split is a DEEPER near-black for the bedroom's
     single message and a GENTLER dim for the living-area full board (lighter
     ground, higher-contrast text). That needs no JS: <html> already carries
     data-layout, so it is one more block —

       :root[data-palette="night"][data-layout="full"]{ ... }

     — overriding only the tokens that differ. Do not build it before somebody
     has looked at the real screens at night.

     Set on <html>, not on .stage, so the letterboxed margin around the stage
     matches instead of framing the board in a lighter rectangle. */
  :root[data-palette="night"]{
    --paper:#080603; --card:#0e0b06; --ink:#c0831f;
    --muted:#7a5219; --soft:#9a6a22; --line:#241a10;
    --done:#8a6a2a; --done-ink:#8a6a2a; --mark:#8a6a2a; --note-ink:#b07d29;
    /* The check-in green, at night. These HAD no night values, which is a real
       hazard rather than an omission: the day --ok-bg is #e3f1e4, so the first
       green chip after 8pm would have put a near-WHITE panel on the living
       room's dark board — precisely what this palette exists to prevent, and it
       would have appeared for the first time on a day nobody was testing.
       Green is kept rather than folded into the amber, because the hue IS the
       meaning here and the palette's stated rule bans white and blue, not
       colour as such. Luminance is matched to --soft so it reads as "lit, but
       part of this board". PROVISIONAL, like every other number in this block:
       it has never been seen on a television in a dark room. */
    --ok-bg:#0f1509; --ok-ink:#7f9c50; --ok-edge:#3f5226;
  }

  /* ---- BEDROOM NIGHT: deeper still ----------------------------------
     The anticipated palette split, now built. Keyed on the SCREEN, not on
     the layout, and that distinction matters: a focus takeover uses the
     single-message layout on every screen, so keying this on
     [data-layout="single"] would also dim a 2pm takeover in the living room,
     where she is awake and reading. The thing being targeted is the room, so
     the selector names the room.

     Ground is true black. She is in bed; this only has to be readable if she
     looks at it, and every lumen it does not emit is the point.

     ONLY --paper, --ink AND --soft ARE EVER SEEN HERE. The bedroom's night
     layout is the single-message one — no card, no calendar, no notes — so
     the remaining tokens below (card, muted, line, done, mark, note-ink) are
     inert on this screen; they are set for completeness (a takeover could
     theoretically reuse a card class later) but nothing currently renders
     them. If you are hunting for what controls what's ON SCREEN here, it is
     exactly these three. (An earlier draft of this comment wrote those names
     with -- and / between them and accidentally spelled the literal
     characters "*" "/" back to back, which ends a CSS comment early — the
     whole rule below silently vanished as a result. Say custom-property
     names as prose here, never with a stray * next to a /.)

     Pushed deliberately BELOW the WCAG large-text floor (3:1) that the shared
     night palette above happens to clear. That floor was never a stated
     requirement for this screen — the design intent recorded elsewhere in
     this file is "legibility traded for darkness on purpose" for a
     glance-if-you-look screen, and holding to 3:1 was a stricter line than
     that intent called for. --ink now measures ~2.2:1, --soft ~1.5:1.
     Deliberately NOT equal: --ink carries the message, which is the one
     thing worth being able to read if she does look; --soft carries only the
     clock, which matters less. Still provisional, still needs the room —
     if it turns out unreadable even glancing, back off ONE of these two
     tokens rather than both, to keep that hierarchy intact. */
  :root[data-screen="bedroom"][data-palette="night"]{
    --paper:#000000; --card:#040201; --ink:#603d0e;
    --muted:#3c2609; --soft:#3c2609; --line:#0d0803;
    --done:#3c2609; --done-ink:#3c2609; --mark:#3c2609; --note-ink:#4a2f0b;
  }
  /* .grid is display:grid and .single is display:flex, either of which beats
     the UA's [hidden]{display:none}. Only one layout is ever in the DOM flow —
     a hidden box must not be measurable, or auto-fit would size against it. */
  [hidden]{ display:none !important; }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%; background:#000; overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #frame{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }

  .stage{
    /* flex:0 0 auto is load-bearing. #frame is a flex container, and a flex
       item SHRINKS by default -- so on any viewport narrower than 1280 CSS px
       the stage was being squashed to fit instead of scaled by the transform,
       which re-wrapped every line and drove auto-fit to its minimums. The
       stage must always lay out at exactly 1280x720 and be scaled, never
       resized. */
    flex:0 0 auto;
    /* position:relative anchors .photo's position:absolute;inset:0 to the
       1280x720 stage itself, not to #frame (position:fixed) further up —
       anchoring there would size the overlay against the raw viewport
       instead of the scaled board underneath it. */
    position:relative;
    /* --vs is the vertical squeeze, set by fit(): stage height / 720. Silk
       gives us a SHORT viewport, and fixed header/footer/padding would eat
       the cards. Everything vertical scales with it so the squeeze is shared
       rather than dumped entirely on the content. */
    --vs:1;
    width:1280px; height:720px; transform-origin:center center;
    background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column;
    padding:calc(20px*var(--vs)) 32px calc(16px*var(--vs));
    gap:calc(14px*var(--vs));
    overflow:hidden;
  }

  /* ---- Header: the single most-asked question, full width ----
     line-height 1.25 (not 1.05) so the overflow:hidden needed by the
     auto-shrink can't clip the descenders in "Today"/"August". */
  .head{ flex:0 0 auto; height:calc(96px*var(--vs)); display:flex; align-items:baseline;
         justify-content:space-between; gap:26px; }
  .today-is{
    font-size:72px; font-weight:800; letter-spacing:-1px; line-height:1.25;
    white-space:nowrap; overflow:hidden; flex:1 1 auto; min-width:0;
  }
  .clock{
    flex:0 0 auto; font-size:calc(46px*var(--vs)); font-weight:800; line-height:1.25;
    font-variant-numeric:tabular-nums; color:var(--soft); white-space:nowrap;
  }

  /* ---- Body: left = today + notes, right = full-height timeline ---- */
  .grid{ flex:1 1 auto; display:grid; grid-template-columns:55.7fr 43.7fr; gap:calc(16px*var(--vs));
         min-height:0; overflow:hidden; }
  .col{ display:flex; flex-direction:column; gap:calc(16px*var(--vs)); min-height:0; overflow:hidden; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:calc(14px*var(--vs)) 24px calc(16px*var(--vs)); display:flex; flex-direction:column;
    min-height:0; overflow:hidden;
  }
  /* Starting split only; renderFull() sets the real one (ROUTINE_SPLIT). */
  #card-today{ flex:1 1 0; }
  #card-notes{ flex:1 1 0; }
  #card-cal  { flex:1 1 0; }
  .cap{ flex:0 0 auto; font-size:calc(21px*var(--vs)); font-weight:800; letter-spacing:2.5px;
        color:var(--muted); margin-bottom:calc(10px*var(--vs)); }
  .body{ flex:1 1 auto; min-height:0; overflow:hidden;
         display:flex; flex-direction:column; }
  .body > *{ flex:0 0 auto; }          /* never compress; let auto-fit decide */

  /* ---- TODAY ---- */
  #card-today{ --fs:44px; }
  .today-list{ list-style:none; display:flex; flex-direction:column; gap:calc(var(--fs)*0.30); }
  .today-list li{ font-size:var(--fs); font-weight:700; line-height:1.16;
                  display:flex; gap:calc(var(--fs)*0.30); align-items:baseline; }
  .today-list .n{ flex:0 0 auto; color:var(--note-ink); font-variant-numeric:tabular-nums; }

  /* A long list (a daily routine rather than a few errands) goes into two
     columns. Ten items stacked would have to drop to ~15px to fit, which is
     unreadable across a room; two columns hold roughly twice that. Multi-column
     fills top-to-bottom, so 1-5 sit above 6-10 rather than snaking sideways. */
  .today-list.two{ display:block; column-count:2; column-gap:calc(var(--fs)*1.0); }
  .today-list.two li{ break-inside:avoid; margin-bottom:calc(var(--fs)*0.30); }

  /* ---- NOTES ---- */
  #card-notes{ --fs:27px; }
  .notes{ list-style:none; display:flex; flex-direction:column; gap:calc(var(--fs)*0.45); }
  .notes li{ font-size:var(--fs); font-weight:600; line-height:1.30; }

  /* ---- CALENDAR: past (✓) → TODAY → upcoming ---- */
  #card-cal{ --fs:26px; }
  .cal{ list-style:none; display:flex; flex-direction:column; gap:calc(var(--fs)*0.40); }
  .cal li{ display:flex; gap:calc(var(--fs)*0.42); align-items:baseline; line-height:1.16; }
  .cal .mark{ flex:0 0 calc(var(--fs)*0.95); font-size:calc(var(--fs)*0.88);
              text-align:center; color:var(--done); }
  .cal .when{ flex:0 0 calc(var(--fs)*6.0); font-size:calc(var(--fs)*0.86);
              font-weight:700; color:var(--muted); white-space:nowrap; }
  .cal .what{ flex:1 1 auto; font-size:var(--fs); font-weight:600; }
  .cal li.past .what{ color:var(--done-ink); }
  .cal li.ahead .when{ color:var(--note-ink); }

  .cal li.divider{ align-items:center; gap:12px; margin:2px 0; }
  .cal li.divider .lbl{ font-size:calc(var(--fs)*0.62); font-weight:800;
                        letter-spacing:3px; color:var(--mark); }
  .cal li.divider .rule{ flex:1 1 auto; height:2px; background:var(--line); }

  .empty{ font-size:var(--fs); font-weight:600; color:var(--muted); }

  /* ---- SINGLE MESSAGE: the other layout axis -------------------------
     One dominant sentence where the grid would otherwise be. Used by BOTH
     night and focus, so the fit/clip invariants are solved once rather than
     twice, and a single centred block is the easiest possible case for the
     measured auto-fit.

     The ceiling is high on purpose: a short message ("Greg stepped out, back
     around 4:00") should land enormous, because the whole point of a takeover
     is that it reads from across the room at a glance. Unlike the header this
     one WRAPS — fitMessage() steps it down until it fits, so a long message
     simply arrives smaller instead of clipping. */
  .single{
    flex:1 1 auto; min-height:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    /* A starting value only: fitMessage() overwrites it inline before this box
       is ever shown, from MSG_MAX or MSG_MAX_NIGHT. Kept in step with MSG_MAX
       so a stylesheet read on its own is not misleading. */
    --fs:160px;
  }
  .single .msg{
    /* flex:0 0 auto — the message must report its NATURAL height so
       fitMessage() can compare it against the box; a shrinkable item would
       report the squashed height and the measurement would always "fit". */
    flex:0 0 auto; max-width:92%; text-align:center;
    font-size:var(--fs); font-weight:800; line-height:1.18;
    letter-spacing:-1px; overflow-wrap:break-word;
  }

  /* ---- PHOTO MOMENT: an occasional overlay, not a layout mode ----------
     A curated photo fades in ABOVE the board, holds a while, fades back —
     see the script for the full safety model (decode-gated, hard capped,
     interrupted by focus/night). This block is CSS only: how it looks, never
     when it appears.

     position:absolute;inset:0 takes it out of the flex column entirely, so
     showing or hiding it can never perturb .grid's or .single's own layout —
     the board underneath keeps rendering exactly as it would with the
     overlay absent, which is what lets it fade back to something always
     current rather than something frozen at the moment the photo started.

     Opacity, not [hidden]/display, and always present in the DOM: display
     toggling cannot transition, so a smooth ~1s cross-fade needs the element
     to exist at opacity:0 the whole time and simply move to opacity:1 and
     back. pointer-events:none while hidden is just hygiene — nothing on this
     board is clickable, but an invisible full-stage box eating input would be
     a strange thing to leave unguarded.

     Painted in whichever palette is current: the table and living room show
     moments at night too, so --paper and --soft resolve to the night tokens
     then and the moment sits on the dark ground. The bedroom never shows one
     at night (see momentBlockedBy() in the script).

     ONE overlay, shared by both kinds of moment: a photo swaps in the image
     wrap below, a gentle message swaps in the message box. That is not tidiness
     — it is the whole collision model. Two kinds of thing rotating cannot
     overlap when there is only one box for them to appear in. */
  .moment{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--paper);
    opacity:0; pointer-events:none;
    transition:opacity 1s ease;
    padding:calc(24px*var(--vs)) 48px calc(20px*var(--vs));
    gap:calc(16px*var(--vs));
  }
  .moment.show{ opacity:1; pointer-events:auto; }
  .moment-img-wrap{
    flex:1 1 auto; min-height:0; width:100%;
    display:flex; align-items:center; justify-content:center;
  }
  /* object-fit:contain, never cover or a crop — a face must never be cut off
     by the frame, and the letterbox strips this leaves are filled by .moment's
     own --paper background, so they read as a deliberately framed photo
     rather than a rendering glitch. */
  .moment-img-wrap img{
    max-width:100%; max-height:100%; display:block;
    object-fit:contain; border-radius:16px;
  }
  /* Caption box: a FIXED height budget (not intrinsic to its text), exactly
     like .single, so fitMessage() has something stable to measure against
     regardless of caption length — see fitMessage()'s own comment for why an
     intrinsic-height box can't be auto-fit this way. Reuses fitMessage()
     itself (generalised to take element ids rather than hardcoded ones) —
     the spec asked for the existing fit machinery, not a hand-rolled second
     copy of it. */
  .photo-cap-box{
    flex:0 0 auto; width:100%; height:calc(84px*var(--vs));
    display:flex; align-items:center; justify-content:center;
    --fs:32px;                    /* starting value only; fitMessage() owns it */
  }
  .photo-cap{
    flex:0 0 auto; max-width:90%; text-align:center;
    font-size:var(--fs); font-weight:600; line-height:1.30; color:var(--soft);
  }

  /* The other thing that can be in the overlay: a gentle message. Takes the
     image wrap's place and its flex share, so the auto-fit measures against
     the same stable box a photo would have had — see fitMessage() for why an
     intrinsic-height box cannot be fitted this way.

     Set in --ink, not --soft: this is a statement someone typed, not a caption
     under a photo, and it should read with the same authority a takeover has.
     It is the SIZE that says "this is a moment, not a takeover" (see
     GENTLE_MSG_MAX), not a quieter colour — a washed-out message on a board
     built for failing eyesight would be the wrong economy. */
  .moment-msg-box{
    flex:1 1 auto; min-height:0; width:100%;
    display:flex; align-items:center; justify-content:center;
    --fs:96px;                    /* starting value only; fitMessage() owns it */
  }
  .moment-msg{
    flex:0 0 auto; max-width:92%; text-align:center;
    font-size:var(--fs); font-weight:700; line-height:1.18; color:var(--ink);
  }

  /* ---- ?debug=1 readout ----
     Fixed to the VIEWPORT and deliberately outside .stage: it must never
     enter the stage's flow, its transform, or fitBlock()'s measurements.
     Sized and contrasted to be read across the room or through a Tapo
     camera, not from a chair. Absent from the DOM entirely without the flag. */
  #debug{
    position:fixed; left:12px; bottom:12px; z-index:99;
    background:rgba(18,16,12,.88); color:#f6f2e9;
    font:600 17px/1.4 "Segoe UI",Roboto,Arial,sans-serif;
    letter-spacing:.4px; padding:9px 13px; border-radius:10px;
    white-space:pre; pointer-events:none;
  }

  /* ---- CHECK-IN CHIPS -------------------------------------------------
     One row of four, full width, between the board and the reassurance line.
     Read-only: no click handlers anywhere in the script, no :hover, no
     :focus, no cursor change. She never touches the TV — the buttons are on
     her phone, and a chip that looked pressable would be a promise the
     television cannot keep.

     flex:0 0 auto and every vertical metric scaled by --vs, like everything
     else in the stage: the strip takes a fixed share of the squeeze rather
     than being squashed, and what it takes comes out of .grid, which
     fitBlock() then absorbs as slightly smaller card type. See HANDOFF.md for
     the measured cost.

     The colours are all existing tokens, so the strip follows the day and
     night palettes with no rules of its own. */
  /* EVERY NUMBER IN THIS BLOCK IS A MEASURED BUDGET, NOT A TASTE DECISION.
     Read HANDOFF.md's "What the strip costs" table before changing any of
     them. The board at 1280x650 has no spare vertical space at all, and the
     first design of this strip (caption on its own line, comfortable chips,
     108px, full board width) drove TODAY'S ROUTINE to its 15px floor AND
     clipped it, which is invariant 1.

     It now sits INSIDE THE LEFT COLUMN, between the routine and the notes
     (Greg, 2026-09-15), which changes the geometry in two ways that matter:

       - the calendar is no longer charged for it AT ALL. The right column
         never sees this element, so card-cal measures exactly as it does with
         check-ins switched off. The whole cost lands on the left column,
         where the routine's ceiling came down 10% in the same change to pay
         for it.
       - the chips are ~160px wide instead of ~240px. That is why the caption
         went back ABOVE the row rather than inline beside it: inline, it ate
         95px of a 673px column — 14% of the width, taken straight out of four
         already-narrow chips. A line of its own costs ~23px of height and is
         the cheaper trade here, which is the opposite of the answer when this
         strip was full width. */
  .chips{ flex:0 0 auto; display:flex; flex-direction:column;
          gap:calc(5px*var(--vs)); }
  .chips-cap{ flex:0 0 auto; font-size:calc(14px*var(--vs)); font-weight:800;
              letter-spacing:1.6px; color:var(--muted); line-height:1.3;
              white-space:nowrap; }
  /* Two rows of four (2026-09-26). The row gap is tighter than the column gap
     on purpose: vertical space is the scarce one in this column, and 6px
     between rows still reads as two rows rather than a block. */
  .chips-row{ display:grid; grid-template-columns:repeat(4,1fr);
              gap:calc(6px*var(--vs)) calc(9px*var(--vs)); }
  /* Label left, status right. The label sets one word per line (the break is
     explicit in CHECKINS), the status sits beside it and never wraps.

     A note for anyone tempted to stack these to win type size: it does work —
     side by side the two compete for the same ~140px, so the label caps at
     14px, while stacked it can reach ~23px. It was tried and reverted. Stacked
     costs ~50px more strip height, and at that height the strip stops fitting
     on most routine lengths and simply drops. Side by side at 14px that
     actually survives beats 23px that is usually not on screen. */
  .chip{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:calc(5px*var(--vs)) 10px calc(6px*var(--vs));
    display:flex; flex-direction:row; align-items:center;
    gap:calc(5px*var(--vs));
    min-width:0; overflow:hidden;
  }
  /* nowrap + overflow:hidden is what lets fitLine() measure this; the name is
     then shrunk until it fits rather than being ellipsised. Same contract as
     the header: the CSS size is a ceiling, nothing is ever cut off. */
  /* Wraps, so no nowrap. min-width:0 is load-bearing on a flex child — without
     it the label refuses to shrink below its longest word and pushes the
     status out of the chip instead of wrapping. */
  .chip-name{ flex:1 1 auto; min-width:0; font-weight:700; color:var(--soft);
              line-height:1.1; overflow:hidden;
              font-size:calc(20px*var(--vs)); }
  .chip-line{ white-space:nowrap; overflow:hidden; }
  /* flex:0 0 auto and nowrap: the time must never wrap or shrink away, so the
     LABEL yields to it rather than the other way round.

     min-width RESERVES the column even when empty, which is not cosmetic:
     without it an unpressed chip hands its whole width to the label, so its
     two lines re-flow to one and the chip — and with it the whole strip —
     changes height the moment she checks something in, re-typesetting the
     three cards underneath her. Reserved, all eight stay the same shape all
     day. 5.8em holds the widest time this can render ("✓ 12:05 PM", tabular
     digits) with slack; fitChips() measures and shrinks if it ever does not. */
  .chip-when{ flex:0 0 auto; min-width:5.8em; font-weight:800; line-height:1.15;
              color:var(--muted); text-align:right;
              font-variant-numeric:tabular-nums; white-space:nowrap;
              font-size:calc(19px*var(--vs)); }
  .chip[data-on="1"]{ background:var(--ok-bg); border-color:var(--ok-edge); }
  .chip[data-on="1"] .chip-name{ color:var(--ok-ink); }
  .chip[data-on="1"] .chip-when{ color:var(--ok-ink); }

  /* ---- Footer: the reassurance line ---- */
  .reassure{ flex:0 0 auto; text-align:center; font-size:calc(46px*var(--vs)); font-weight:700;
             color:var(--soft); line-height:1.25; }
</style>
</head>
<body>
  <div id="frame">
    <div class="stage">

      <div class="head">
        <div class="today-is" id="today-is">—</div>
        <div class="clock" id="clock">—</div>
      </div>

      <div class="grid" id="grid">
        <div class="col">
          <div class="card" id="card-today">

   gap is the difference between "it worked" and "it didn'''t", and she cannot be
   asked to wait and look again.

   /exec was timed at 4.0-8.5s per call end to end, of which ~0.08s is network

   the same order as the cap, and the reason it has not bitten is probably that
   the Fire TVs sleep (see OPERATIONS.md) rather than that there is headroom.
   Tripling one screen'''s rate on top of that is not a safe thing to do blind,
   and the billed number is not visible from outside — it is in Apps Script'''s

const FETCH_TIMEOUT = 20*1000;
const STALE_NOTE_MS = 25*60*1000;   /* quietly show "updated" past this */
const STORE_KEY     = 'momboard.v1';

const DEFAULT_REASSURE = 'Everything is okay. You are safe and loved.';

   Was 9pm, chosen for SLEEP — dark while she is in bed — which is the
   bedroom's problem. Moved to 8pm because the living areas have a different

   the table and living-room screens are still being READ in the evening — she

   she will be standing at just after pressing a button on her phone; the
   living room is glanced at and the bedroom is not read at all. Scoping it to
   one screen is also what keeps the endpoint's daily runtime where it was —
   see the arithmetic in OPERATIONS.md. */
const SCREEN_MODES = {
  'bedroom':     { night:true, nightLayout:'single', nightMoments:false, fastPoll:false },
  'table':       { night:true, nightLayout:'full',   nightMoments:true,  fastPoll:true  },
  'living-room': { night:true, nightLayout:'full',   nightMoments:true,  fastPoll:false }

const DEFAULT_SCREEN_MODE = { night:true, nightLayout:'full', nightMoments:true, fastPoll:false };

/* Ceiling and floor for the single-message type. The floor is the same 15px

   far is being misused — that is a NOTES line, not a takeover — but the board
   answers that by rendering it small and whole, never by cutting it off.

   rather than an oversight. Both use the same component and the same auto-fit,

   screen allows, because being unmissable is its whole job, while the night
   message wants to be legible from the bed and no larger — at the full ceiling

   which is exactly what the night palette exists to avoid. Measured at 1280x650

   request, alongside darkening the bedroom's ink token) is a starting point,
   not a settled number, and remains a candidate to come down further. That
   the direction was right was decided by looking at the render; how far is
   right cannot be, because the question is how much light a dark bedroom gets

   let a later edit "restore" it to MSG_MAX for consistency with focus — the

const MSG_MAX = 160, MSG_MAX_NIGHT = 56, MSG_MIN = 15;

/* ---- PHOTO MOMENTS ---------------------------------------------------

   board, holds, fades out. Built to add warmth without spending the board's
   CONSTANCY — the property doing most of the therapeutic work — so every
   default here leans calm, low-cadence, and instantly reversible. See
   HANDOFF.md for the full safety model; this block is just the numbers.

   Context that shaped every default: a recent minor ischemic stroke on top
   of an unassessed cognitive condition means (a) emotional lability — an
   evocative image can land harder and faster than expected, so the master
   switch below must be a one-cell, no-redeploy "bad day" off, and (b)
   fatigue/overstimulation — hence still images only, muted, low cadence,
   daytime only, and a caption that never claims anything happened. */

function mediaEnabled(){
  return String(settings.media||'').trim().toLowerCase()==='on';
}

/* Opt-IN, exactly like media and for the same reason: this one ships dark and
   is switched on in the Sheet only after it has been seen in the room. Absent
   or anything other than "on" means off, and off means the strip is not
   rendered at all — it contributes no height and the three cards measure
   exactly as they do today. */
function checkinsEnabled(){
  if(TEST_CHECKINS) return true;
  return String(settings.checkins||'').trim().toLowerCase()==='on';
}

/* Cadence and hold, both overridable via Settings, both CLAMPED so a typo

   (too-long a hold). The clamp is the safety rail; the *_DEFAULT values are

const MEDIA_EVERY_MIN_DEFAULT = 80;   // ~75-90 min: a couple of times an afternoon
/* Lowered 20 -> 10 -> 2 on request. Still a rail, not the number itself: it
   stops a stray "0" or "0.1" in mediaEveryMin from turning moments into a

const MEDIA_EVERY_MIN_FLOOR   = 2;    // never more often than this, whatever is typed
const MEDIA_HOLD_SEC_DEFAULT  = 25;
const MEDIA_HOLD_SEC_FLOOR    = 5;
const MEDIA_HOLD_SEC_CEILING  = 60;   // beyond this it is not a "moment", it is a takeover

  const base=(isFinite(n)&&n>0)?n:MEDIA_EVERY_MIN_DEFAULT;

const PHOTO_DECODE_TIMEOUT_MS = 6*1000;    // preload budget before a "skip silently"
const MEDIA_FAIL_COOLDOWN_MS = 30*60*1000; // a dead file stops stealing turns for this long
const PHOTO_CAP_MAX = 32, PHOTO_CAP_MIN = 15;

             suppressed: one sentence, full ceiling, continuously, until its
             instant. "Greg stepped out, back around 4:00."
     gentle  the same kind of news when it does NOT warrant suppressing the

   deliberately the same value: the two kinds of moment share one overlay and
   one hard cap, so there is no reason one may come round closer together than
   the other. Low on request (2026-09-15): some circumstances want a much more
   regular pulse than the 15-minute default, and that call belongs in the
   Sheet, not here. At 2 minutes with a 20-second hold the message is up
   roughly a sixth of the time — a lot, which is the point of it being

const GENTLE_HOLD_SEC_DEFAULT  = 20;  // read at a glance; shorter than a photo's dwell
const GENTLE_HOLD_SEC_FLOOR    = 5;
const GENTLE_HOLD_SEC_CEILING  = 60;  // past this it is not a moment, it is a takeover

  const n=parseFloat(v);

}
function clampGentleHoldSec(v){
  const n=parseFloat(v);
  const base=(isFinite(n)&&n>0)?n:GENTLE_HOLD_SEC_DEFAULT;

   panel allows, because being unmissable is its whole job; a gentle message

const GENTLE_MSG_MAX = 96;

/* Bare filenames in the Sheet's File column resolve against this — the repo's
   own /media/ folder, relative to wherever the page itself is served, so it
   works at gpapciak.github.io/reminders/ or any other path without hardcoding

  const f=String(file||'').trim();
  if(!f) return '';
  if(/^https?:\/\//i.test(f)) return f;
  return MEDIA_BASE+encodeURIComponent(f);

/* ---- CHECK-INS -------------------------------------------------------

   Sheet's Log tab through the same /exec endpoint. The board reads them back

   recorded time. They clear at midnight.

   That invariant forbids turning elapsed time into a claim that something
   happened — which is why routine items are never auto-greyed. This is the
   exact opposite: it is her own EXPLICIT confirmation, stamped by the server
   at the moment she made it. The board reports what she said. It never
   computes what she probably did, and nothing here may ever start to.

   them, by design — she does not touch the TV, and the board is read-only.

   "TODAY'S CHECK-INS", and that caption is doing safety work, not decoration.
   It scopes every chip under it to the RECORD rather than the act: a grey

   your medicine". That distinction is the whole reason the caption exists.

   So no chip ever contains:
     - a negative statement ("not taken", "missed", "due") — if she took the
       pill and forgot to press, that would be the double-dose risk from

     - an instruction ("tap your phone") — an earlier draft had exactly that,

/* Eight, in two rows of four (2026-09-26). `lines` is the label broken

   and "Biking/" breaks where it is meant to rather than wherever the box
   happens to run out. A one-word title still reserves the second line, which

/* The chip label CEILING. A ceiling, not a target: fitChips() walks it down

   kept as a named constant because it stops being inert the moment anything
   widens the chips (a full-width strip, fewer per row), and because raising it
   is the first thing anyone will try. See HANDOFF.md before doing so. */
const CHIP_MAX = 16;

const CHECKINS = [
  { kind:'medicine-am', lines:['Meds','AM'] },
  { kind:'medicine-pm', lines:['Meds','PM'] },
  { kind:'shower',      lines:['Shower',''] },
  { kind:'exercise',    lines:['Biking/','Walking'] },
  { kind:'drops-am',    lines:['Drops','AM'] },
  { kind:'drops-pm',    lines:['Drops','PM'] },
  { kind:'outside',     lines:['Outside','Time'] },
  { kind:'memory',      lines:['Memory','Practice'] }
];

/* ---- URL flags and device identity ---------------------------------

const DEBUG = /(^|[?&])debug=1(&|$)/.test(location.search);
/* The ONE test flag that is deliberately NOT gated on ?demo=1, because its
   whole job is to be used on a real board against real data: it lets the strip
   be seen on the table display, through the camera, before the Sheet is
   touched and before it goes live for every screen at once. That is safe to
   leave ungated precisely because the board is read-only — this flag can
   reveal a display element and nothing else. It cannot write, cannot change
   what the Sheet says, and cannot make a chip green that is not already green.

   strip would silently vanish an hour into the test. */
const TEST_CHECKINS = /(^|[?&])checkins=1(&|$)/.test(location.search);

/* ---- Test hooks — ALL require ?demo=1 -------------------------------

   reachable by hand on a running board and neither can be checked without
   waiting for 9pm or editing live data a household depends on. These make
   every combination openable in a browser:

     ?demo=1&night=1              force night   (&night=0 forces it off)
     ?demo=1&focus=Back+at+4      force a takeover
             &focusuntil=4:00 pm  ...until this LA time  (default: end of day)
     ?demo=1&nightmsg=…           override the night text
     ?demo=1&now=2026-08-15T22:30 pretend it is this LA wall-clock time;
                                  the clock then ticks on from there
     ?demo=1&screen=bedroom       plus the normal per-screen config
     ?demo=1&media=on             force the master switch on (or off)
             &mediaeverymin=5     ...and this cadence
             &mediaholdsec=8      ...and this hold
             &photonow=1          fire one right now instead of waiting
     ?checkins=1                  show the check-in strip without editing the
                                  Sheet. The ONE flag that does not need
                                  demo=1 — see TEST_CHECKINS for why that is
                                  safe, and note it survives the hourly reload.
     ?demo=1&gentle=Back+at+4     a rotating message instead of a takeover
             &gentleuntil=4:00 pm ...until this LA time  (default: end of day)
             &gentleeverymin=3    ...coming round this often
             &gentleholdsec=8     ...and staying this long
             &gentlenow=1         show it right now instead of waiting

   nothing here is reachable on the live board by a stray query string. */
const TEST_NIGHT = DEMO?paramOf('night'):'';

/* The endpoint is public, so anything from a query string is untrusted before
   it reaches the Sheet. Sanitised here AND again server-side. Never blank: an
   unlabelled display must appear in the Status tab as "unnamed" rather than
   quietly not being counted — a screen missing from the list is indistinguish-
   able from a screen that never checked in. */
const SCREEN=(function(){
  const id=paramOf('screen').toLowerCase().trim()
    .replace(/[\s_]+/g,'-')
    .replace(/[^a-z0-9-]/g,'')
    .replace(/-{2,}/g,'-')
    .replace(/^-+|-+$/g,'')
    .slice(0,24);

})();
const DEMO_DATA = {
  today:[ 'Researching care options','OnPoint Credit Union','Best Buy','Gratitude' ],
  notes:[ 'Greg is here for {days:2026-08-20}. Then Kathy comes. Then Chris.' ],
  reassure: DEFAULT_REASSURE,
  calendar:[
    { date:'2026-08-04', what:'Saw Dr. Amal' },
    { date:'2026-08-06', what:'Had PT with Cindy' },
    { date:'2026-08-10', what:'1:30 pm  Dentist – crown' },
    { date:'2026-08-10', what:'2:30 pm  Realtor – Elaine Simms' },
    { date:'2026-08-18', what:'1:50 pm  Dr. Amal' },
    { date:'2026-08-19', what:'Kathy arrives' },
    { date:'2026-08-19', what:'3:30 pm  PT with Cindy' },
    { date:'2026-08-27', what:'Pest control follow-up' },
    { date:'2026-09-02', what:'2:00 pm  Dental cleaning' },
    { date:'2026-09-17', what:'3:10 pm  Eyehealth NW' },
  ],
  /* One real, decodable placeholder (see media/README.md — not a photo) so
     the demo path exercises the actual same-origin fetch, and one file that
     genuinely does not exist, so the failure/skip path is exercised for
     real too rather than simulated. Never reachable outside ?demo=1. */
  media:[
    { file:'demo-placeholder.svg', caption:'A demo photo, not a real one', screens:[] },
    { file:'this-file-does-not-exist.jpg', caption:'', screens:[] },
  ],
  /* Check-ins, as LA minutes-past-midnight rather than instants — they are
     turned into today's instants at boot, so a demo window is never showing
     yesterday. Deliberately MIXED: two pressed, two not, which is the state
     that has to be looked at (all-green and all-grey both hide the contrast
     the strip depends on), and evening medicine left grey because "grey all
     morning and that is normal" is the case the copy has to survive. */
  checkins:{ 'medicine-am':8*60+20, 'shower':10*60+5, 'drops-am':8*60+25, 'outside':11*60+40 },
};

/* What the board shows when it has nothing trustworthy for today.
   Deliberately NOT yesterday's plans: a stale day row must never be
   presented as though it were current. Dated events are different —
   they are self-validating, so they survive (see paint()). */
function safeFallback(){
  return { today:[], notes:[], calendar:[], reassure:DEFAULT_REASSURE };
}

/* 2. TIME — always America/Los_Angeles (Mom's timezone) */
const TZ='America/Los_Angeles';
const fmtTime =new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
const fmtToday=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric'});
const fmtISO  =new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
/* Calendar cells are plain dates with no time — format them in UTC so a
   machine in another timezone can never shift them by a day. */
const fmtRow  =new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});

function isoLA(d){                       // -> "2026-08-07"
  const p={}; fmtISO.formatToParts(d).forEach(x=>{ p[x.type]=x.value; });
  return p.year+'-'+p.month+'-'+p.day;
}
function isoToUTCDate(s){                // "2026-08-07" -> Date at UTC midnight
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||'').trim());
  return m ? new Date(Date.UTC(+m[1],+m[2]-1,+m[3])) : null;
}
function shiftISO(iso,days){
  const d=isoToUTCDate(iso); if(!d) return null;
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
function daysBetween(fromISO,toISO){
  const a=isoToUTCDate(fromISO), b=isoToUTCDate(toISO);
  if(!a||!b) return null;
  return Math.round((b.getTime()-a.getTime())/86400000);
}

/* ---- LA wall clock, for the night window ---------------------------
   hour12:false rather than hourCycle:'h23' — the older option is understood
   by every engine this has to run in, and midnight coming back as "24" is
   handled by the %24 below. */
const fmtLAParts=new Intl.DateTimeFormat('en-US',{timeZone:TZ,
  year:'numeric',month:'2-digit',day:'2-digit',
  hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
function laParts(d){
  const p={}; fmtLAParts.formatToParts(d).forEach(function(x){ p[x.type]=x.value; });
  return p;
}
/** Minutes since LA midnight. Uses the SERVER-SKEWED clock via its caller, so
 *  a drifting Fire TV cannot flip the bedroom into night an hour early. */
function laMinutes(d){
  const p=laParts(d);
  return (+p.hour%24)*60 + (+p.minute);
}
/** "9:00 pm" / "21:00" / "6am" -> minutes since midnight, or null if it is not
 *  a clock time. Null always means "I did not understand this", never a time. */
function parseClockMin(v){
  const m=/^\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?\s*$/i.exec(String(v==null?'':v));
  if(!m) return null;
  let h=+m[1]; const mi=m[2]?+m[2]:0;
  const ap=(m[3]||'').toLowerCase().charAt(0);
  if(mi>59) return null;
  if(ap){ if(h<1||h>12) return null; h=h%12; if(ap==='p') h+=12; }
  else if(h>23) return null;
  return h*60+mi;
}
function clockMinOr(v,fallback){ const n=parseClockMin(v); return n===null?fallback:n; }

/* ---- {days:YYYY-MM-DD} ------------------------------------------------
   Countdowns typed by hand go stale silently ("Greg here for 13 more days"
   is wrong tomorrow and nobody notices). Instead the Sheet holds the DATE
   and the board does the arithmetic every render:

     "Greg is here for {days:2026-08-20}."  ->  "... for 12 more days."
                                                "... for 1 more day."
                                                "... for today."

   Once the date has passed the whole line is DROPPED rather than shown
   with a wrong or negative number. Same reasoning as the calendar: never
   turn stale data into a confident statement. */
const DAYS_TOKEN=/\{days:(\d{4}-\d{2}-\d{2})\}/g;
function expandDays(text,todayISO){
  let expired=false;
  const out=String(text==null?'':text).replace(DAYS_TOKEN,function(_,iso){
    const n=daysBetween(todayISO,iso);
    if(n===null||n<0){ expired=true; return ''; }
    if(n===0) return 'today';
    if(n===1) return '1 more day';
    return n+' more days';
  });
  return { text:out.replace(/\s{2,}/g,' ').trim(), expired:expired };
}
function expandList(list,todayISO){
  return (list||[]).map(function(t){ return expandDays(t,todayISO); })
                   .filter(function(r){ return !r.expired && r.text; })
                   .map(function(r){ return r.text; });
}

/* 3. AUTO-FIT — every box declares a max type size and shrinks only
   as far as it must. Layout can never clip and never scrolls. */
/* Measures the whole .body, so anything inside it (the list AND the standing
   prompt) is accounted for. Measuring only the list is how the standing
   prompt was able to overflow the card unnoticed. */
function fitBlock(cardId, max, min){
  const card=document.getElementById(cardId);
  const body=card.querySelector('.body');
  let s=max;
  card.style.setProperty('--fs',s+'px');
  while(s>min && body.scrollHeight>body.clientHeight){
    s-=1; card.style.setProperty('--fs',s+'px');
  }
  return s;
}
function fitLine(el,max,min){
  el.style.fontSize=max+'px';
  for(let s=max; s>min && el.scrollWidth>el.clientWidth; ){ s-=1; el.style.fontSize=s+'px'; }
}
/* The single-message block. Same contract as fitBlock() — the CSS size is a
   ceiling and this only ever shrinks — with two differences:

   1. Height is measured as the MESSAGE's own height against the box's, not
      with scrollHeight. The box centres its child, and a centred flex item
      that overflows spills equally above and below; the half above the top
      edge is invisible to scrollHeight, so an overflowing message would
      measure as fitting. offsetHeight sidesteps that entirely. scrollWidth
      then covers the one case wrapping cannot fix: a single word longer
      than the line.
   2. Coarse pass then fine pass. This ceiling is ~6x a card's, so a 1px walk
      from the top would be ~130 reflows on a Fire TV every time the message
      changes; 6px steps down and at most five back up gets the same answer. */
/* Generalised over element ids — the same shape (a flex-centred box with a
   fixed height budget, holding one flex:0 0 auto text block sized off --fs)
   also fits the photo caption, so this is called twice rather than copied
   once. Any future single-centred-block-with-a-height-budget gets this for
   free too. */
function fitMessage(boxId,msgId,max,min){
  const box=document.getElementById(boxId);
  const msg=document.getElementById(msgId);
  function set(s){ box.style.setProperty('--fs',s+'px'); }
  function fits(){
    return msg.offsetHeight<=box.clientHeight && msg.scrollWidth<=msg.clientWidth+1;
  }
  let s=max; set(s);
  while(s>min && !fits()){ s=Math.max(min,s-6); set(s); }
  while(s<max){ set(s+1); if(!fits()){ set(s); break; } s+=1; }
  return s;
}

/* 4. RENDER */

/* Pick a window around today so the column never overflows: recent past
   above the divider, upcoming below, backfilling whichever side is short. */
/* Thirteen entries is the priority; the calendar gives up type size to hold
   them. Was ten, with a standing prompt under the list; the prompt was removed
   on request (2026-09-14) and its height went to three more rows (13 measured
   as the most that costs no type size at 1280x650). Dropped entries are always the furthest-future ones, which reappear as they
   approach. Past entries are never trimmed first — they are what answers
   "have we contacted X yet?".

   Exception: a CROWDED HORIZON earns the room. Once 8 or more things are
   coming up, the past is capped at 2 and the freed rows go to upcoming — at
   that point "what is coming" matters more than a long tail of confirmations,
   and the recent past is still represented. When the future is thin the past
   expands to fill the column instead, so the card is never half empty. */
const PAST_MAX=4, PAST_MAX_BUSY=2, BUSY_AHEAD=8, TOTAL_MAX=13;

/* Left column: type ceilings, and the routine card's share (of 100) of the
   column height. On request (2026-09-14) the routine gave up 10% of its type
   and 10% of its height to NOTES, which gets read while the routine mostly
   doesn't. Was a 44px ceiling for both and a 6/4 (long list) or 5/4 (short
   list) split. The long-list ceiling is 90% of the 31px the real 8-item
   routine resolved to before; the short-list one is 90% of the old 44. NOTES'
   ceiling went up so the height it gained turns into bigger type. */
/* Routine ceilings, down 10% (28 -> 25, 40 -> 36) on request, 2026-09-15, to
   pay for the check-in strip now sitting in this column. These are CEILINGS,
   so on a long routine — already fitted well below them — this changes
   nothing; what it buys is the short-routine case, where the card used to
   inflate to fill its share and left the strip nothing. */
const ROUTINE_MAX={ many:25, few:36 }, NOTES_MAX=40;
/* Share of the left column going to the ROUTINE; the notes card gets the rest,
   minus whatever the check-in strip takes first (it is flex:0 0 auto). Notes
   moved 46/50 -> 38/42 on request (2026-09-26): the notes box was standing
   taller than its content needed, and that height is the only slack in this
   column now that the strip is eight buttons in two rows. */
const ROUTINE_SPLIT={ many:62, few:58 };
function calendarWindow(items, todayISO){
  const clean=(items||[])
    .filter(e=>e&&isoToUTCDate(e.date)&&String(e.what||'').trim())
    .slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const past =clean.filter(e=>e.date<todayISO);
  const ahead=clean.filter(e=>e.date>=todayISO);

  const busy=ahead.length>=BUSY_AHEAD;
  const pastCap=busy?PAST_MAX_BUSY:PAST_MAX;

  let nPast =Math.min(past.length,pastCap);
  let nAhead=Math.min(ahead.length,TOTAL_MAX-nPast);
  /* Only a quiet horizon lets the past spill into the spare rows. Under the
     busy cap those rows belong to upcoming, which is the whole point. */
  if(!busy) nPast=Math.min(past.length,TOTAL_MAX-nAhead);

  /* Never let a cap hide things silently. */
  const hidden=(past.length-nPast)+(ahead.length-nAhead);
  if(hidden>0&&window.console&&console.info){
    console.info('board: '+hidden+' calendar entr'+(hidden===1?'y':'ies')+
                 ' not shown ('+past.length+' past, '+ahead.length+' upcoming available'+
                 (busy?', past capped at '+PAST_MAX_BUSY+' - busy horizon':'')+')');
  }
  return { past:past.slice(past.length-nPast), ahead:ahead.slice(0,nAhead) };
}

function whenLabel(iso, todayISO){
  if(iso===todayISO)             return 'Today';
  if(iso===shiftISO(todayISO,1)) return 'Tomorrow';
  const d=isoToUTCDate(iso);
  return d ? fmtRow.format(d) : '';
}

/* Two things on the same day print the date once. */
function calRow(e, todayISO, done, repeat){
  const li=document.createElement('li');
  li.className=done?'past':'ahead';
  const mark=document.createElement('span'); mark.className='mark';
  mark.textContent=(done&&!repeat)?'✓':'';
  const when=document.createElement('span'); when.className='when';
  when.textContent=repeat?'':whenLabel(e.date,todayISO);
  const what=document.createElement('span'); what.className='what'; what.textContent=e.what;
  li.appendChild(mark); li.appendChild(when); li.appendChild(what);
  return li;
}
/* A pipe — or a newline typed with Alt+Enter — forces a line break WITHIN one
   item, so family can control where a sentence wraps. In the Days tab a newline
   already splits into separate notes, so there it is the pipe that matters; in
   the Settings tab the value is read whole, so both work.
   Built from text nodes, never innerHTML — the text comes from a Sheet that
   several people edit. */
function setTextWithBreaks(el, text){
  el.innerHTML='';
  String(text==null?'':text).split(/\r?\n|\|/).forEach(function(part,i){
    if(i) el.appendChild(document.createElement('br'));
    el.appendChild(document.createTextNode(part.trim()));
  });
}

function emptyRow(text){
  const li=document.createElement('li'); li.className='empty'; li.textContent=text; return li;
}

/* Swap which layout is in the DOM flow. Never both: a hidden box has no
   measurable height, and auto-fit measuring against the wrong one is exactly
   how a layout silently collapses to its minimum type size. */
function showLayout(which){
  document.getElementById('grid').hidden   = which!=='full';
  document.getElementById('single').hidden = which!=='single';
  /* The strip belongs to the full board only. A focus takeover and the night
     message both exist to REPLACE the board with one sentence; a row of chips
     underneath either of them would be precisely the clutter they are there
     to remove. renderChips() then decides whether the full board shows it. */
  document.getElementById('chips').hidden  = which!=='full';
}

/* The single-message layout — one component, used by BOTH night and focus.
   Header stays (orientation is the whole point of this layout: the date and
   the time are the two questions the board exists to answer, and they are
   true in every mode). Middle is the message. Bottom is the reassurance line
   for focus; night omits it — the night message is itself the reassurance,
   and a second line of glowing text in a dark bedroom is the opposite of
   minimal. */
function renderSingle(text,bottomLine,ceiling){
  showLayout('single');
  setTextWithBreaks(document.getElementById('single-msg'),text);
  const re=document.getElementById('reassure');
  re.hidden=!bottomLine;
  if(bottomLine) re.textContent=bottomLine;
  fitMessage('single','single-msg',ceiling,MSG_MIN);
}

/* Rebuilt on every full paint rather than diffed: four elements, and the
   board already rebuilds its lists this way. Crucially it runs BEFORE the
   fitBlock() calls at the end of renderFull(), because the strip's height is
   subtracted from .grid and the cards must be measured against what is
   actually left, not against the layout as it was a frame ago. */
function renderChips(todayISO){
  const wrap=document.getElementById('chips');
  if(!checkinsEnabled()){ wrap.hidden=true; return; }
  wrap.hidden=false;
  const kinds=todaysCheckIns(todayISO);
  const row=document.getElementById('chips-row');
  row.innerHTML='';
  CHECKINS.forEach(function(c){
    const at=kinds[c.kind];
    /* A number, and a sane one. Anything else is treated as not-recorded:
       showing "Invalid Date" beside her medicine would be worse than showing
       nothing, and the safe direction here is always grey. */
    const on=(typeof at==='number')&&isFinite(at)&&at>0;

    const chip=document.createElement('div');
    chip.className='chip';
    if(on) chip.setAttribute('data-on','1');

    const name=document.createElement('div');
    name.className='chip-name';
    /* Two explicit lines, always — including the empty second one for a
       one-word title, so every chip is the same height and the two rows line
       up. Separate elements rather than a <br> so each line can be measured
       on its own by fitChips(). */
    c.lines.forEach(function(t){
      const ln=document.createElement('div');
      ln.className='chip-line';
      ln.textContent=t||'\u00a0';      /* nbsp: an empty div has no height */
      name.appendChild(ln);
    });

    const when=document.createElement('div');
    when.className='chip-when';
    /* No skew added: this is an absolute instant from the server, like
       focusUntilMs and unlike the local Date.now() stamps. The board formats
       it with the same fmtTime as the clock in the header, so the time on the
       chip and the time she is looking at are in the same voice. */
    /* nbsp rather than empty when unpressed: an empty line collapses, and the
       chip would then be shorter than its pressed neighbours. */
    when.textContent=on?('\u2713 '+fmtTime.format(new Date(at))):'\u00a0';

    chip.appendChild(name); chip.appendChild(when); row.appendChild(chip);
  });
  fitChips(row);
}

/* Fit the whole strip as ONE group, not chip by chip.
   Fitted independently, "Shower" sits at the ceiling while "Morning medicine"
   shrinks — four different type sizes in one row, which reads as broken rather
   than as fitted. So the size only ever ratchets DOWN across all four, and the
   survivor is applied to every chip.

   Two things are measured, because side by side there are two ways to fail:
     - the LABEL's longest word must fit its column (scrollWidth), and the
       wrapped label must fit the chip's height (scrollHeight);
     - the TIME must fit without wrapping.
   The time is checked first and shrinks with the label, because a chip only
   ~160px wide cannot always hold both at the size either would like.

   Same contract as every other box on this board: the CSS size is a ceiling
   and this only ever shrinks. Load-bearing rather than belt-and-braces here —
   the labels genuinely do not fit at the ceiling in a left-column chip. */
function fitChips(row){
  const names=row.querySelectorAll('.chip-name');
  /* The individual LINES, not their container. Each line is its own nowrap
     box, so when a word is too wide it overflows THAT box — and .chip-name,
     which has overflow:hidden of its own, reports a scrollWidth that has
     already been clipped to its content box and looks like a fit. Measuring
     the container here silently let labels be cut off; measure the lines. */
  const lines=row.querySelectorAll('.chip-line');
  const whens=row.querySelectorAll('.chip-when');
  const max=Math.round(CHIP_MAX*vScale), min=Math.round(10*vScale);
  function apply(px){
    Array.prototype.forEach.call(names,function(el){ el.style.fontSize=px+'px'; });

    /* The time rides one point below the label: tabular digits read cleanly a
       size down, and it is the half with no room to wrap. */
    Array.prototype.forEach.call(whens,function(el){
      el.style.fontSize=Math.max(min,px-1)+'px'; });
  }
  function overflows(){
    let bad=false;
    /* Width is asked of each LINE (see above); height is asked of the
       container, because that is what holds both lines. */
    Array.prototype.forEach.call(lines,function(el){
      if(el.scrollWidth>el.clientWidth+1) bad=true; });
    Array.prototype.forEach.call(names,function(el){
      if(el.scrollHeight>el.clientHeight+1) bad=true; });
    Array.prototype.forEach.call(whens,function(el){
      if(el.scrollWidth>el.clientWidth+1) bad=true; });
    return bad;
  }
  let size=max; apply(size);
  while(size>min && overflows()){ size-=1; apply(size); }
  return size;
}

function renderFull(data,todayISO){
  showLayout('full');
  document.getElementById('reassure').hidden=false;
  renderChips(todayISO);
  /* TODAY'S ROUTINE — deliberately NOT auto-greyed as the day goes on. We
     don't know that something actually happened, and guessing is how you get a
     wrong answer to "did that happen yet?". It is also not hers to complete:
     the list exists so she can see what usually comes next, which is steadying
     when short-term memory is unreliable.

     The numbers stay. They are not checklist markers -- they carry the reading
     order across the two columns, so item 5 is unambiguously after item 4 even
     though it sits at the top of the next column. */
  const tl=document.getElementById('today-list'); tl.innerHTML='';
  const items=(data.today||[]).map(t=>String(t||'').trim()).filter(Boolean);
  /* A short errand list stays one column and stays large. A long routine list
     splits in two and hands the left column more of the height, since NOTES
     needs far less of it. Both thresholds are content-driven, so the layout is
     stable for as long as the shape of the day's list is.

     THE THRESHOLD MOVED 6 -> 4 (2026-09-15), and it is worth writing down why,
     because it looks like it should cost type size and it does the opposite.
     Measured at 1280x650, the single-column path was rendering a FIVE-item
     routine at 22px and a six-item one at 18px — both below the 25px ceiling
     two columns can hold, because one tall column has to shrink to fit the
     card's height while two short ones do not. So "stays one column and stays
     large" stopped being true somewhere around five items, and nobody had
     re-measured it since the card's height changed.

     It was found while fitting the check-in strip: at five and six items the
     left column was so saturated that the strip could not fit at ANY height,
     not even 30px. Splitting earlier fixes both at once — bigger routine type
     on those days AND room for the strip. */
  const many=items.length>4;
  tl.classList.toggle('two',many);
  const share=many?ROUTINE_SPLIT.many:ROUTINE_SPLIT.few;
  document.getElementById('card-today').style.flex=share+' 1 0';
  document.getElementById('card-notes').style.flex=(100-share)+' 1 0';
  if(!items.length){ tl.appendChild(emptyRow('Nothing planned today.')); }
  items.forEach((t,i)=>{
    const li=document.createElement('li');
    const n=document.createElement('span'); n.className='n'; n.textContent=(i+1)+'.';
    const w=document.createElement('span'); w.textContent=t;
    li.appendChild(n); li.appendChild(w); tl.appendChild(li);
  });

  const nl=document.getElementById('notes'); nl.innerHTML='';
  const notes=(data.notes||[]).map(n=>String(n||'').trim()).filter(Boolean);
  if(!notes.length){ nl.appendChild(emptyRow('No notes today.')); }
  notes.forEach(n=>{ const li=document.createElement('li'); setTextWithBreaks(li,n); nl.appendChild(li); });

  const cal=document.getElementById('cal'); cal.innerHTML='';
  const win=calendarWindow(data.calendar,todayISO);
  let prev=null;
  win.past.forEach(e=>{ cal.appendChild(calRow(e,todayISO,true,e.date===prev)); prev=e.date; });
  const div=document.createElement('li'); div.className='divider';
  const lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent='TODAY';
  const rule=document.createElement('span'); rule.className='rule';
  div.appendChild(lbl); div.appendChild(rule); cal.appendChild(div);
  if(!win.ahead.length){ cal.appendChild(emptyRow('Nothing on the calendar yet.')); }
  prev=null;
  win.ahead.forEach(e=>{ cal.appendChild(calRow(e,todayISO,false,e.date===prev)); prev=e.date; });

  document.getElementById('reassure').textContent =
    data.reassure || 'Everything is okay. You are safe and loved.';

  /* THE STRIP YIELDS. Invariant 1 — nothing is ever clipped — outranks the
     check-in strip, and on this board that is not a theoretical conflict: at
     the real 1280x650 Silk viewport a ten-item routine has about 50px of
     slack and the strip wants 54px. Measured, it fits at 8, 10 and 12 items
     and does NOT fit at 6 (the single-column `few` path is tighter than it
     looks) or at 15.

     So the strip is fitted like everything else here: it is a ceiling, and it
     steps down — to zero, which is the only step it has. Cards first, strip
     only if what is left over allows it.

     This is deliberately NOT a viewport threshold or an item-count rule. Both
     would be a guess about content nobody has typed yet, and the board's whole
     layout posture is to measure the actual boxes rather than predict them.
     The cost is honest and is written down in HANDOFF.md: on some days the
     strip is there and on some days it is not, which is exactly why the
     placement is still an open question rather than a settled one. */
  let clipped=fitCards(many);
  const chipsEl=document.getElementById('chips');
  chipsDropped=false;
  if(clipped&&!chipsEl.hidden){
    chipsEl.hidden=true;
    chipsDropped=true;
    clipped=fitCards(many);      /* re-fit against the space just given back */
  }
}

/** True if this card's content still overflows after auto-fit — i.e. it hit
 *  its floor and something is being cut off. */
function cardClips(id){
  const b=document.getElementById(id).querySelector('.body');
  return b.scrollHeight>b.clientHeight+1;
}
/** Fit all three cards; returns whether any of them still clips. */
function fitCards(many){
  fitBlock('card-today',many?ROUTINE_MAX.many:ROUTINE_MAX.few,15);
  fitBlock('card-notes',NOTES_MAX,15);
  fitBlock('card-cal',  26,14);
  return cardClips('card-today')||cardClips('card-notes')||cardClips('card-cal');
}

/* 5. STATE
   dayRow   — today's row. Date-specific, so it EXPIRES at midnight.
   events   — the calendar. Every entry carries its own date, so it stays
              valid across midnight and is kept even when the day row is
              stale or missing. This split is the whole safety model:
              undated things expire, dated things don't. */
let dayRow=null;      /* { forDate, at, today[], notes[], reassure }        */
/* Check-ins are DAY-SCOPED, so this is shaped exactly like dayRow and guarded
   exactly like it: a forDate that must equal today or the whole block is
   ignored. That guard is the single most important line in this feature. A
   display that lost its network overnight must wake up showing four grey
   chips, because the alternative — yesterday's green "Morning medicine 8:20
   AM" still sitting there this morning — tells her she has taken a pill she
   has not taken. The server independently refuses to send anything but today's
   rows (readLog), so it takes two separate failures to produce that, not one. */
let logRow=null;      /* { forDate, at, kinds:{kind:epochMs} }               */
/* Set by renderFull() when the strip had to yield to the cards. Diagnostic
   only — nothing reads it but ?debug=1, and it exists because "the strip is
   missing" and "the strip was dropped so the routine would not clip" look
   identical on screen and are completely different problems. */
let chipsDropped=false;
let events=null;      /* { at, list[] }                                     */
let settings={};      /* { reassure, notes, night, nightstart… }     */
let clockSkewMs=0;    /* server time - device time; Fire TV clocks drift    */
let inFlight=false, lastOkAt=0, lastError=null, hbState='?';

/* The two TIME-BOUNDED messages. Identical shape, identical expiry rules
   (activeTimedMsg), cached like everything else — which is only safe because
   each carries an absolute instant. They are held in separate variables
   rather than one slot because they can be authored independently and only
   one of them suppresses the board.
     focus   an acute takeover — selectMode() switches the whole board to it
     gentle  a rotating moment — the overlay shows it a few seconds at a time
   See the GENTLE MESSAGES block above for why they are two things. */
let focusMsg='';        /* raw text, {days:} not yet expanded               */
let focusUntilMs=0;     /* absolute instant, resolved by the SERVER         */
let focusForDate='';    /* the LA date the server resolved it for           */
let gentleMsg='', gentleUntilMs=0, gentleForDate='';

/* Photo moments. mediaList is undated the same way settings are —
   there is no expiry model here, just "the current curated list", refreshed
   every fetch like everything else non-day-specific. */
let mediaList=[];             /* [{file,caption,screens[]}] from the Sheet   */
let mediaQueue=[];            /* shuffled remaining picks, no immediate repeat */
let mediaLastShownFile='';
let mediaFailedAt={};         /* file -> Date.now() of its last decode failure */
let momentState='idle';        /* idle | loading | showing | fading-out       */
let momentKind='';            /* what is in the overlay: '' | photo | gentle  */
/* Each kind of moment keeps its OWN due-time; the shared scheduler ticks at
   whichever cadence is faster and hands each slot to whatever is due. Two
   clocks, one timer — see attemptMoment(). Both start at 0, i.e. due at the
   very first slot, which is what makes the no-gentle-message case behave
   exactly as it did before any of this existed. */
let photoDueAt=0, gentleDueAt=0;
let photoLoadToken=0;         /* invalidates a preload that resolves too late */
let momentTimer=null;          /* the scheduling timer (self-rescheduling)     */
let momentArmedEveryMin=0;     /* the cadence momentTimer was armed with        */
let momentNextAt=0;            /* Date.now() stamp momentTimer will fire at     */
let momentLast='none yet';     /* last attempt's outcome, for ?debug=1 only    */
let momentLastAt=0;
let momentHoldTimer=null, momentFadeOutTimer=null, momentHardCapTimer=null;

function deviceNow(){ return new Date(Date.now()+clockSkewMs); }
function refreshMs(){ return screenMode().fastPoll?REFRESH_MS_FAST:REFRESH_MS; }

/** All-or-nothing, like setFocus(): without the date the block cannot be
 *  expired, so a block with no date is not kept at all. */
function setLog(kinds,forDate){
  const d=String(forDate||'').trim();
  if(!d){ logRow=null; return; }
  logRow={ forDate:d, at:Date.now(),
           kinds:(kinds&&typeof kinds==='object')?kinds:{} };
}
/** The only way anything reads a check-in. Returns {} unless the stored block
 *  is for TODAY — so midnight empties the strip with no fetch and no network,
 *  the same way it empties the day row. */
function todaysCheckIns(todayISO){
  return (logRow&&logRow.forDate===todayISO)?(logRow.kinds||{}):{};
}

/** All three or none. A message with no instant is not a timed message — it
 *  is a stuck one waiting to happen — so the whole thing is dropped rather
 *  than half-kept. One function, because this is the rule that makes either
 *  message safe to cache and there must not be two versions of it. */
function timedMsg(msg,untilMs,forDate){
  const m=String(msg==null?'':msg).trim();
  const u=(typeof untilMs==='number'&&isFinite(untilMs))?untilMs:0;
  if(!m||u<=0) return {m:'',u:0,d:''};
  return {m:m,u:u,d:String(forDate||'')};
}
function setFocus(msg,untilMs,forDate){
  const t=timedMsg(msg,untilMs,forDate);
  focusMsg=t.m; focusUntilMs=t.u; focusForDate=t.d;
}
function setGentle(msg,untilMs,forDate){
  const t=timedMsg(msg,untilMs,forDate);
  gentleMsg=t.m; gentleUntilMs=t.u; gentleForDate=t.d;
}

function save(){
  try{ localStorage.setItem(STORE_KEY,JSON.stringify({d:dayRow,e:events,s:settings,
       f:{m:focusMsg,u:focusUntilMs,d:focusForDate},
       g:{m:gentleMsg,u:gentleUntilMs,d:gentleForDate},l:logRow,md:mediaList})); }
  catch(err){}
}
function restore(){
  try{
    const raw=localStorage.getItem(STORE_KEY); if(!raw) return;
    const o=JSON.parse(raw)||{};
    if(o.d&&o.d.forDate) dayRow=o.d;
    /* No STORE_KEY bump needed for this addition, and it is worth saying why
       rather than leaving the next person to work it out: restore() guards
       every field INDEPENDENTLY, so a store written by an older build simply
       has no `l` and logRow stays null — which renders as four grey chips, the
       correct empty state. An older build reading a newer store ignores `l`
       the same way. Neither direction can produce a wrong chip. */
    if(o.l&&o.l.forDate) logRow=o.l;
    if(o.e&&Object.prototype.toString.call(o.e.list)==='[object Array]') events=o.e;
    if(o.s&&typeof o.s==='object') settings=o.s;
    if(o.f&&typeof o.f==='object') setFocus(o.f.m,o.f.u,o.f.d);
    if(o.g&&typeof o.g==='object') setGentle(o.g.m,o.g.u,o.g.d);
    if(Object.prototype.toString.call(o.md)==='[object Array]') mediaList=o.md;
  }catch(err){}
}

/* 6. FETCH */
function loadData(){
  if(inFlight||DEMO||!ENDPOINT) return Promise.resolve();
  inFlight=true;
  /* Cache-bust every request. Silk caches aggressively and Apps Script
     responses are otherwise indistinguishable request to request. */
  const url=ENDPOINT+(ENDPOINT.indexOf('?')<0?'?':'&')+'t='+Date.now()+
            '&screen='+encodeURIComponent(SCREEN);
  let ctrl=null,timer=null;
  try{ ctrl=new AbortController(); }catch(err){ ctrl=null; }
  if(ctrl) timer=setTimeout(function(){ try{ctrl.abort();}catch(err){} },FETCH_TIMEOUT);
  const opts={cache:'no-store',redirect:'follow'};
  if(ctrl) opts.signal=ctrl.signal;

  return fetch(url,opts)
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(p){
      if(!p||p.ok===false) throw new Error((p&&p.error)||'endpoint reported failure');
      /* Trust the server's clock over the TV's for BOTH the displayed time
         and the row lookup, so a drifting Fire TV cannot show the wrong day. */
      if(typeof p.serverEpochMs==='number'&&isFinite(p.serverEpochMs)){
        clockSkewMs=p.serverEpochMs-Date.now();
      }
      const todayISO=isoLA(deviceNow());
      const row=(p.days||{})[todayISO]||null;
      settings=p.settings||{};
      events={ at:Date.now(), list:(p.events||[]).filter(function(e){
                 return e&&isoToUTCDate(e.date)&&String(e.what||'').trim(); }) };
      /* A successful fetch that finds no row for today is still GOOD news —
         we now know there is nothing planned, rather than failing to ask. */
      dayRow={ forDate:todayISO, at:Date.now(),
               today:(row&&row.today)||[], notes:(row&&row.notes)||[],
               reassure:(row&&row.reassure)||'' };
      /* The until-instant is resolved SERVER-side, where the LA date is
         already known and already authoritative, and capped there at LA
         end-of-day. The client stays dumb: one absolute comparison, made at
         paint time. Anything missing or malformed arrives as 0 and setFocus()
         turns the whole thing off — a takeover is never the failure mode. */
      setFocus(p.focus,p.focusUntilEpochMs,p.focusForDate);
      setGentle(p.gentle,p.gentleUntilEpochMs,p.gentleForDate);
      /* Both halves from the server, never synthesised here: the date the
         block is FOR comes from the endpoint's own LA clock, so a drifting
         Fire TV cannot widen its own idea of "today" and keep a chip green
         past midnight. A response with no logForDate clears the block. */
      setLog(p.log,p.logForDate);
      /* Sanitised shape-check only — pickNextPhoto()/screenEligibleForPhoto()
         already tolerate a malformed entry (missing file, non-array screens),
         so this just guards against the whole thing not being an array at
         all (a very old cached response, an endpoint mid-edit). */
      mediaList=Array.isArray(p.media)?p.media:[];
      /* The timer is armed at boot from whatever settings were cached. A
         display with no cache (first boot, cleared storage) armed the 80-
         minute DEFAULT — and the hourly reload always landed first, so that
         screen never showed a photo at all. Re-arm whenever the fetched
         cadence differs from the armed one; an unchanged cadence is left
         alone so every 3-minute fetch doesn't keep pushing the moment back. */
      /* momentEveryMin(), not the media cadence alone: a gentle message that
         has just ARRIVED is the sharpest case of this bug. Without the re-arm
         a board sitting on an 80-minute photo timer would not show a message
         someone typed a minute ago for over an hour — by which time it may
         already have expired. */
      if(momentTimer&&momentEveryMin()!==momentArmedEveryMin){
        scheduleNextMomentAttempt();
      }
      hbState=String(p.heartbeat||'?');
      lastOkAt=Date.now(); lastError=null;
      save();
    })
    .catch(function(err){ lastError=err; })     /* keep whatever we had */
    .then(function(){
      if(timer) clearTimeout(timer);
      inFlight=false;
      paint();
    });
}

/* 7. DISPLAY MODES — two independent axes, three combinations.
   ------------------------------------------------------------------
     PALETTE   day (warm paper/ink)  |  night (near-black, amber)
     LAYOUT    full (header+grid+reassurance)  |  single-message

     day board  = day   + full            (what has always been here)
     night      = night + single-message  (the night orientation text)
     focus      = day   + single-message  (an ad-hoc takeover)
                  ...or night + single-message, at 3am in the bedroom.

   Evaluated on every paint, never latched, so nothing has to be switched
   off again by the thing that switched it on.

   CARVE-OUT — read this before "fixing" it. The invariant "nothing is ever
   inferred from time passing" forbids turning elapsed time into a CLAIM THAT
   SOMETHING HAPPENED: meds taken, a meal eaten, an item on the routine done.
   That is why routine items are never auto-greyed. Neither switch below does
   that. Changing palette at 9pm is presentation. Retiring a focus message at
   its until-time REMOVES an explicitly-authored statement and returns the
   board to its safe baseline. Time passing here only ever removes or restyles
   information; it never asserts that an event occurred. This is the same
   "undated information expires" rule that empties the day row at midnight and
   drops an expired {days:} line — applied to a message.

   That still holds now the palette applies to the FULL board on every screen,
   and this is the case where it looks most like a violation: at 9pm the whole
   board changes colour, every card at once. It is worth being exact about why
   it is fine. Restyling is not asserting. The routine says the same things in
   the same order, the calendar's checkmarks still come from comparing dates,
   and not one line means something different at 21:01 than it did at 20:59 —
   the only thing the clock changed is how much light the panel emits. The
   test to apply to any future clock-driven behaviour is unchanged: does it
   change WHAT the board claims, or only how that claim looks? */

/** This screen's config, with a living-area-shaped default for anything not
 *  listed (including "unnamed"). Never returns undefined — a screen name
 *  nobody anticipated must still land on a defined behaviour. */
function screenMode(){
  return SCREEN_MODES[SCREEN]||DEFAULT_SCREEN_MODE;
}
function screenAllowsNight(){ return !!screenMode().night; }

/** The window this screen dims on. Every screen gets the same one today; this
 *  exists so the earlier living-area window (see NIGHT_START_MIN) becomes a
 *  lookup here rather than a change to every caller. */
function nightWindowFor(cfg){
  return { start:clockMinOr(settings.nightstart,NIGHT_START_MIN),
           end:  clockMinOr(settings.nightend,  NIGHT_END_MIN) };
}
function inNightWindow(now,win){
  /* Identical start and end reads as an empty window, not a 24-hour one. A
     typo in the Sheet must not be able to hold a display in night mode all
     day, when nobody in the house can see the URL that would prove why. */
  if(win.start===win.end) return false;
  const m=laMinutes(now);
  return win.start>win.end ? (m>=win.start||m<win.end)   /* crosses midnight */
                           : (m>=win.start&&m<win.end);
}
/** The PALETTE axis, on its own. Nothing here knows or cares what layout the
 *  screen will use — that is decided separately in selectMode(). */
function isNight(now){
  if(TEST_NIGHT==='1') return true;
  if(TEST_NIGHT==='0') return false;
  const cfg=screenMode();
  return !!cfg.night&&inNightWindow(now,nightWindowFor(cfg));
}

/* The timed-message safety model, in ONE function, for BOTH messages.
   Returns the text to show, or '' for "nothing to say, carry on".

   Shared on purpose. A gentle message needs these guards MORE than a focus
   takeover does, not less: a wrong takeover is at least sitting in front of
   whoever next walks into the room, while a wrong gentle message fades itself
   back in every few minutes, mostly when nobody is watching. Two copies of
   this would be two places for that to drift. */
function activeTimedMsg(msg,untilMs,forDate,todayISO,now){
  if(!msg||!(untilMs>0)) return '';
  /* Two guards, and they fail in the same direction — off.
     - The ABSOLUTE instant is what makes a cached message safe to keep: a
       bare "4:00 pm" re-read against tomorrow would resurrect a stale
       message, an instant cannot. It also needs no network to expire, and
       it is compared HERE, at paint time, not once when the data arrived.
     - The date it was resolved for caps it at that day even if a nonsense
       number somehow got through, so "Greg is gone until 4:00" can never
       still be on the screen at 9pm, let alone tomorrow. */
  if(forDate&&forDate!==todayISO) return '';
  if(now.getTime()>=untilMs) return '';
  /* {days:} works in either message. Note this does NOT use expandList's
